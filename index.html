s-left fw-row-2\">\n        <span class=\"fwsc-tag\">Your AI Program<\u002Fspan>\n        <span class=\"fwsc-name\">Cowork / Copilot<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"fw-arrow fw-row-2\"><svg viewBox=\"0 0 56 18\" width=\"100%\" height=\"18\">\n        <path d=\"M 8 9 L 48 9\" stroke=\"#07358E\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" fill=\"none\"><\u002Fpath>\n        <path d=\"M 2 9 L 10 4 M 2 9 L 10 14\" stroke=\"#07358E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <path d=\"M 54 9 L 46 4 M 54 9 L 46 14\" stroke=\"#07358E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <\u002Fsvg><\u002Fdiv>\n      <div class=\"fw-os-row fw-row-2\">\n        <div class=\"fw-block is-agents\">\n          <div class=\"fw-block-head\"><span class=\"fwbh-icon\">◇<\u002Fspan><span>Agents<\u002Fspan><\u002Fdiv>\n          <div class=\"fw-block-row cols-3\">\n            <span class=\"fw-chip\">MCP<\u002Fspan>\n            <span class=\"fw-chip\">Studio<\u002Fspan>\n            <span class=\"fw-chip\">Tools &amp; Guardrails<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"fw-tip is-below\">\n            <span class=\"fw-tip-head\">How the solution actually runs.<\u002Fspan>\n            <ul>\n              <li>Multi-agent workflows: intake → classification → routing → resolution → escalation → confidence + provenance → orchestration<\u002Fli>\n              <li>Built in Agent Studio. Inspectable. Governed. Human-in-the-loop where it matters<\u002Fli>\n              <li>Exposed via MCP — Copilot, internal builds, and other AI tools can all call them directly<\u002Fli>\n              <li>Composable, not a black box<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fw-block is-ml\">\n          <div class=\"fw-block-head\"><span class=\"fwbh-icon\">◈<\u002Fspan><span>Machine Learning<\u002Fspan><\u002Fdiv>\n          <div class=\"fw-block-row cols-1\">\n            <span class=\"fw-chip\">Custom Models<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"fw-tip is-below\">\n            <span class=\"fw-tip-head\">Trained on your domain. Owned by Providence.<\u002Fspan>\n            <ul>\n              <li>Marketing &amp; patient-experience specific models, not general-purpose<\u002Fli>\n              <li>Learns from every analyst and editor correction your team makes<\u002Fli>\n              <li>LLM-agnostic — you choose the underlying model<\u002Fli>\n              <li>The trained model belongs to Providence<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Row 3: In-house Builds ↔ Knowledge Fabric -->\n      <div class=\"fw-side-card is-left fw-row-3\">\n        <span class=\"fwsc-tag\">Your AI Program<\u002Fspan>\n        <span class=\"fwsc-name\">In-house builds<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"fw-arrow fw-row-3\"><svg viewBox=\"0 0 56 18\" width=\"100%\" height=\"18\">\n        <path d=\"M 8 9 L 48 9\" stroke=\"#07358E\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" fill=\"none\"><\u002Fpath>\n        <path d=\"M 2 9 L 10 4 M 2 9 L 10 14\" stroke=\"#07358E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <path d=\"M 54 9 L 46 4 M 54 9 L 46 14\" stroke=\"#07358E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <\u002Fsvg><\u002Fdiv>\n      <div class=\"fw-block is-knowledge fw-row-3\">\n        <div class=\"fw-block-head\"><span class=\"fwbh-icon\">◇<\u002Fspan><span>Knowledge Fabric<\u002Fspan><\u002Fdiv>\n        <div class=\"fw-block-row cols-4\">\n          <span class=\"fw-chip\">APIs<\u002Fspan>\n          <span class=\"fw-chip\">Data Modeling<\u002Fspan>\n          <span class=\"fw-chip\">Context / Hints<\u002Fspan>\n          <span class=\"fw-chip\">Embeddings<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"fw-tip is-above\">\n          <span class=\"fw-tip-head\">The layer that makes generic AI work for Providence specifically.<\u002Fspan>\n          <ul>\n            <li>Your service-line taxonomy, brand voice, and content standards across 50+ hospitals<\u002Fli>\n            <li>Your attribution rules, channel definitions, and performance thresholds<\u002Fli>\n            <li>Historical patterns: which campaigns, which markets, which payer mixes convert<\u002Fli>\n            <li>Provider, location, and find-a-doc data woven through<\u002Fli>\n            <li>Field mapping into Adobe, Salesforce, and Epic (where appropriate)<\u002Fli>\n            <li>Built fast. Belongs to Providence. Pullable via API into any in-house build<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Row 4: Data Lake ↔ Data -->\n      <div class=\"fw-side-card is-left fw-row-4\">\n        <span class=\"fwsc-tag\">Your AI Program<\u002Fspan>\n        <span class=\"fwsc-name\">Data lake<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"fw-arrow fw-row-4\"><svg viewBox=\"0 0 56 18\" width=\"100%\" height=\"18\">\n        <path d=\"M 8 9 L 48 9\" stroke=\"#07358E\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" fill=\"none\"><\u002Fpath>\n        <path d=\"M 2 9 L 10 4 M 2 9 L 10 14\" stroke=\"#07358E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <path d=\"M 54 9 L 46 4 M 54 9 L 46 14\" stroke=\"#07358E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <\u002Fsvg><\u002Fdiv>\n      <div class=\"fw-block is-data fw-row-4\">\n        <div class=\"fw-block-head\"><span class=\"fwbh-icon\">■<\u002Fspan><span>Data<\u002Fspan><\u002Fdiv>\n        <div class=\"fw-block-row cols-2\">\n          <span class=\"fw-chip\">APIs<\u002Fspan>\n          <span class=\"fw-chip tat-cap {\n      font: 500 11.5px/1.4 var(--font);\n      color: var(--text2);\n    }\n\n    .s7op-footer {\n      margin-top: 22px;\n      padding: 18px 26px;\n      background: var(--brand-dim);\n      border-left: 3px solid var(--brand);\n      border-radius: 0 12px 12px 0;\n      display: flex; align-items: center; gap: 22px;\n      flex-wrap: wrap;\n    }\n    .s7op-f-tag {\n      font: 800 10px/1.2 var(--font);\n      letter-spacing: .14em; text-transform: uppercase;\n      color: var(--brand);\n      white-space: nowrap;\n    }\n    .s7op-f-text {\n      font: 500 13.5px/1.5 var(--font);\n      color: var(--ink-1);\n      flex: 1;\n      min-width: 320px;\n    }\n    .s7op-f-text strong { color: var(--brand); font-weight: 700; }\n    .s7op-f-geo {\n      font: 600 11px/1.3 var(--font);\n      color: var(--text3);\n      letter-spacing: .04em;\n      text-transform: uppercase;\n      white-space: nowrap;\n    }\n\n    @media (max-width: 1000px) {\n      .s7op-where-grid { grid-template-columns: 1fr; }\n      .s7op-card-grid { grid-template-columns: 1fr 1fr; }\n      .s7op-traction {\n        grid-template-columns: 1fr 1fr;\n        gap: 20px 26px;\n      }\n      .s7op-tr-label { grid-column: 1 / -1; max-width: none; }\n      .s7op-tr-rule { display: none; }\n    }\n    @media (max-width: 640px) {\n      .s7op-card-grid { grid-template-columns: 1fr; }\n    }\n  <\u002Fstyle>\n\n  <div class=\"shell\">\n    \n\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">Unframe, in <em>one frame<\u002Fem>.<\u002Fh2>\n      <p class=\"s7op-deck\">AI-native enterprise solutions. <em>Delivered in days.<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"s7op-where reveal\" data-delay=\"2\">\n      <span class=\"s7op-section-tag\">Where we usually start<\u002Fspan>\n      <div class=\"s7op-where-grid\">\n        <article class=\"s7op-surface is-obs\" tabindex=\"0\">\n          <div class=\"s7op-surface-h\">\n            <span class=\"s7op-surface-icon\" aria-hidden=\"true\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"6\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span class=\"s7op-surface-name\">Observability &amp; Reporting<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"s7op-surface-body\">Cross-system search, natural-language queries, and auto-generated dashboards across fragmented data.<\u002Fp>\n        <\u002Farticle>\n\n        <article class=\"s7op-surface is-ext\" tabindex=\"0\">\n          <div class=\"s7op-surface-h\">\n            <span class=\"s7op-surface-icon\" aria-hidden=\"true\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M9 8h6M9 12h6M9 16h4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span class=\"s7op-surface-name\">Data extraction &amp; abstraction<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"s7op-surface-body\">Turn PDFs, docs, spreadsheets, and images into structured intelligence — across languages and formats.<\u002Fp>\n        <\u002Farticle>\n\n        <article class=\"s7op-surface is-agents\" tabindex=\"0\">\n          <div class=\"s7op-surface-h\">\n            <span class=\"s7op-surface-icon\" aria-hidden=\"true\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span class=\"s7op-surface-name\">Automation &amp; Agents<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"s7op-surface-body\">AI agents for complex workflows — monitored, human-guided, integrated with your existing systems.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <p class=\"s7op-where-foot\">No limits to the categories. Each solution is tailored to your business.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"s7op-different reveal\" data-delay=\"3\">\n      <span class=\"s7op-section-tag\">How we're different<\u002Fspan>\n      <div class=\"s7op-card-grid\">\n\n        <article class=\"s7op-card\" tabindex=\"0\">\n          <header class=\"s7op-card-header\">\n            <span class=\"s7op-num\">01<\u002Fspan>\n            <span class=\"s7op-name\">Subscribe only when you're happy<\u002Fspan>\n          <\u002Fheader>\n          <p class=\"s7op-collapsed\">No commitment until the solution earns it.<\u002Fp>\n          <div class=\"s7op-expanded\">\n            <p>You don't pay until the solution is in production and proven against your data. <strong>The commercial risk is ours.<\u002Fstrong> Built to remove the “procurement before proof” tax that kills enterprise AI projects.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"s7op-hint\">Hover<\u002Fspan>\n        <\u002Farticle>\n\n        <article class=\"s7op-card\" tabindex=\"0\">\n          <header class=\"s7op-card-header\">\n            <span class=\"s7op-num\">02<\u002Fspan>\n            <span class=\"s7op-name\">Days, not months<\u002Fspan>\n          <\u002Fheader>\n          <p class=\"s7op-collapsed\">Production-ready solutions on a ~3-week PoC.<\u002Fp>\n          <div class=\"s7op-expanded\">\n            <p>Deep technical building blocks assembled by a dedicated <strong>blueprint<\u002Fstrong> into a turnkey solution. No operational burden on your team — transparent, governed, ready to deploy from day one.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"s7op-hint\">Hover<\u002Fspan>\n        <\u002Farticle>\n\n        <article class=\"s7op-card\" tabindex=\"0\">\n          <header class=\"s7op-card-header\">\n            <span class=\"s7op-num\">03<\u002Fspan>\n            <span class=\"s7op-name\">A unified AI program, not point tools<\u002Fspan>\n          <\u002Fheader>\n          <p class=\"s7op-collapsed\">Shared context, knowledge, and governance.<\u002Fp>\n          <div class=\"s7op-expanded\">\n            <p>Unframe embeds <strong>into<\u002Fstrong> your core AI program — not bolted on, not separate. APIs &amp; MCPs throughout, so every solution compounds with every other. It's <strong>not build vs. buy<\u002Fstrong>; it's both, in one program.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"s7op-hint\">Hover<\u002Fspan>\n        <\u002Farticle>\n\n        <article class=\"s7op-card\" tabindex=\"0\">\n          <header class=\"s7op-card-header\">\n            <span class=\"s7op-num\">04<\u002Fspan>\n            <span class=\"s7op-name\">In your perimeter. LLM-agnostic.<\u002Fspan>\n          <\u002Fheader>\n          <p class=\"s7op-collapsed\">No data leaves. You pick the underlying model.<\u002Fp>\n          <div class=\"s7op-expanded\">\n            <p>Deployed in your environment. Permission-aware execution, auditable workflows, optional human-in-the-loop. <strong>Founded and led by cybersecurity and AI experts<\u002Fstrong> — security is the floor, not a feature.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"s7op-hint\">Hover<\u002Fspan>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"s7op-traction reveal\" data-delay=\"4\">\n      <span class=\"s7op-tr-label\">The market is responding<\u002Fspan>\n      <span class=\"s7op-tr-rule\" aria-hidden=\"true\"><\u002Fspan>\n      <div class=\"s7op-stat\">\n        <span class=\"s7op-stat-fig\">$100M<\u002Fspan>\n        <span class=\"s7op-stat-cap\">Series B — total capital raised<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"s7op-tr-rule\" aria-hidden=\"true\"><\u002Fspan>\n      <div class=\"s7op-stat\">\n        <span class=\"s7op-stat-fig\">$0 <em>→<\u002Fem> $100M<\u002Fspan>\n        <span class=\"s7op-stat-cap\">In total contract value, in under 12 months<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"s7op-tr-rule\" aria-hidden=\"true\"><\u002Fspan>\n      <div class=\"s7op-stat\">\n        <span class=\"s7op-stat-fig\">Top <em>0.1%<\u002Fem><\u002Fspan>\n        <span class=\"s7op-stat-cap\">Among the fastest-growing AI companies on record<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"s7op-footer reveal\" data-delay=\"5\">\n      <span class=\"s7op-f-tag\">In short<\u002Fspan>\n      <span class=\"s7op-f-text\">High-priority enterprise AI use cases turned into <strong>production-ready, owned-by-you solutions<\u002Fstrong> — governed, embedded, paid for only when they work.<\u002Fspan>\n      <span class=\"s7op-f-geo\">Cupertino · Tel Aviv · Berlin<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"s8\" data-screen-label=\"08 Next step\">\n  <style>\n    .s7-flow {\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      gap: 12px;\n      margin-bottom: 22px;\n      position: relative;\n    }\n    .s7-step {\n      background: var(--surface);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 22px 22px 20px;\n      display: flex; flex-direction: column;\n      gap: 12px;\n      box-shadow: var(--shadow);\n      position: relative;\n    }\n    .s7-step.is-final {\n      background: var(--brand);\n      color: #fff;\n      border: none;\n    }\n    .s7-step.is-final::after {\n      content: '';\n      position: absolute;\n      right: -32px; top: -32px;\n      width: 140px; height: 140px;\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(64,140,53,.20), transparent 70%);\n      pointer-events: none;\n    }\n    .s7-step-num {\n      font: 800 22px/1 var(--font);\n      color: var(--brand);\n      letter-spacing: -.02em;\n      display: flex; align-items: center; gap: 12px;\n    }\n    .s7-step.is-final .s7-step-num { color: var(--accent-bright); }\n    .s7-step-num .arrow {\n      flex: 1;\n      height: 1px;\n      background: var(--border);\n    }\n    .s7-step.is-final .s7-step-num .arrow {\n      background: rgba(255,255,255,.18);\n    }\n    .s7-when {\n      font: 700 10px/1 var(--font);\n      letter-spacing: .12em;\n      text-transform: uppercase;\n      color: var(--brand);\n      background: var(--brand-dim);\n      padding: 5px 10px;\n      border-radius: 999px;\n      white-space: nowrap;\n    }\n    .s7-step.is-final .s7-when {\n      color: var(--ink-1);\n      background: var(--accent-bright);\n    }\n    .s7-step-name {\n      font: 800 15px/1.25 var(--font);\n      color: var(--text1);\n      letter-spacing: -.015em;\n      position: relative; z-index: 1;\n    }\n    .s7-step.is-final .s7-step-name { color: #fff; }\n    .s7-step-list {\n      list-style: none;\n      display: flex; flex-direction: column;\n      gap: 8px;\n      padding: 0;\n      position: relative; z-index: 1;\n    }\n    .s7-step-list li {\n      font: 400 12.5px/1.5 var(--font);\n      color: var(--text2);\n      padding-left: 14px;\n      position: relative;\n    }\n    .s7-step.is-final .s7-step-list li {\n      color: rgba(255,255,255,.85);\n    }\n    .s7-step-list li::before {\n      content: '';\n      position: absolute;\n      left: 0; top: 7px;\n      width: 5px; height: 5px;\n      border-radius: 50%;\n      background: var(--brand);\n    }\n    .s7-step.is-final .s7-step-list li::before {\n      background: var(--accent-bright);\n    }\n\n    .s7-parallel {\n      background: var(--ink-1);\n      color: #fff;\n      border-radius: 14px;\n      padding: 20px 26px;\n      display: grid;\n      grid-template-columns: auto 1fr;\n      gap: 24px;\n      align-items: center;\n    }\n    .s7p-tag {\n      font: 700 10px/1.2 var(--font);\n      letter-spacing: .14em; text-transform: uppercase;\n      color: var(--accent-bright);\n      display: flex; flex-direction: column;\n      gap: 4px;\n      padding-right: 24px;\n      border-right: 1px solid rgba(255,255,255,.14);\n    }\n    .s7p-tag .label {\n      font: 800 12px/1.2 var(--font);\n      color: #fff;\n      letter-spacing: -.005em;\n      text-transform: none;\n    }\n    .s7p-text {\n      font: 500 13.5px/1.55 var(--font);\n      color: rgba(255,255,255,.88);\n    }\n    .s7p-text strong { color: #fff; font-weight: 700; }\n\n    @media (max-width: 960px) {\n      .s7-flow { grid-template-columns: 1fr; }\n      .s7-parallel { grid-template-columns: 1fr; }\n      .s7p-tag { border-right: none; border-bottom: 1px solid rgba(255,255,255,.14); padding-right: 0; padding-bottom: 14px; }\n    }\n  <\u002Fstyle>\n\n  <div class=\"shell\">\n    \n\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">From <em>working session to PoC in ~3 weeks<\u002Fem>.<\u002Fh2>\n      <p class=\"section-sub\">If anything here is interesting, the next step is a 60-minute working session to scope a PoC. Your team brings the systems and success criteria; we do the build. Here's what follows — and when.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"s7-flow reveal\" data-delay=\"2\">\n\n      <article class=\"s7-step\">\n        <div class=\"s7-step-num\"><span>01<\u002Fspan><span class=\"arrow\"><\u002Fspan><span class=\"s7-when\">Day 1<\u002Fspan><\u002Fdiv>\n        <h3 class=\"s7-step-name\">Use Case Discovery<\u002Fh3>\n        <ul class=\"s7-step-list\">\n          <li>Initial session to understand priorities, workflows, and challenges.<\u002Fli>\n          <li>Align on the target use case, expected outcomes, scope, and constraints.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"s7-step\">\n        <div class=\"s7-step-num\"><span>02<\u002Fspan><span class=\"arrow\"><\u002Fspan><span class=\"s7-when\">Day 3<\u002Fspan><\u002Fdiv>\n        <h3 class=\"s7-step-name\">Scoping &amp; PoC Kickoff<\u002Fh3>\n        <ul class=\"s7-step-list\">\n          <li>Review use case scope, prerequisites, and solution alignment.<\u002Fli>\n          <li>Confirm success criteria, required inputs, timeline, and evaluation plan.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"s7-step\">\n        <div class=\"s7-step-num\"><span>03<\u002Fspan><span class=\"arrow\"><\u002Fspan><span class=\"s7-when\">Day 5–7<\u002Fspan><\u002Fdiv>\n        <h3 class=\"s7-step-name\">PoC Delivery<\u002Fh3>\n        <ul class=\"s7-step-list\">\n          <li>Unframe delivers the first working PoC based on agreed scope, data, and prerequisites.<\u002Fli>\n          <li>Joint review of the solution and preparation of the testing phase.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"s7-step\">\n        <div class=\"s7-step-num\"><span>04<\u002Fspan><span class=\"arrow\"><\u002Fspan><span class=\"s7-when\">Day 8–21<\u002Fspan><\u002Fdiv>\n        <h3 class=\"s7-step-name\">Testing &amp; Refinement<\u002Fh3>\n        <ul class=\"s7-step-list\">\n          <li>Your team tests the PoC end-to-end.<\u002Fli>\n          <li>Regular jour-fixes to refine outputs, make adjustments, and incorporate feedback.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"s7-step is-final\">\n        <div class=\"s7-step-num\"><span>05<\u002Fspan><span class=\"arrow\"><\u002Fspan><span class=\"s7-when\">Review<\u002Fspan><\u002Fdiv>\n        <h3 class=\"s7-step-name\">PoC Conclusion &amp; Next Steps<\u002Fh3>\n        <ul class=\"s7-step-list\">\n          <li>Review results, learnings, and business impact.<\u002Fli>\n          <li>Align on production rollout, including integration and deployment model.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n\n    <div class=\"s7-parallel reveal\" data-delay=\"3\">\n      <div class=\"s7p-tag\">\n        <span>The bar<\u002Fspan>\n        <span class=\"label\">What we'd love to walk away with<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"s7p-text\">Three small commitments, not one big one: <strong>validate the priority cascade<\u002Fstrong>, <strong>pick the direction<\u002Fstrong> that's most pressing, and <strong>schedule the working session<\u002Fstrong>. Your own 2024 line set the bar — “driving 10X value for our customers becomes every marketer's baseline.” We're built to clear it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- right rail -->\n<div class=\"cnav\">\n  <button class=\"cnav-item active\" data-target=\"scxo\"><span class=\"cn-tick\"><\u002Fspan>CXO priorities<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"s2\"><span class=\"cn-tick\"><\u002Fspan>What's pressing<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"s4\"><span class=\"cn-tick\"><\u002Fspan>AI maturity<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"sfail\"><span class=\"cn-tick\"><\u002Fspan>Why AI fails<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"sapproach\"><span class=\"cn-tick\"><\u002Fspan>The approach<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"sstack\"><span class=\"cn-tick\"><\u002Fspan>Solution stack<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"sfabric\"><span class=\"cn-tick\"><\u002Fspan>Knowledge fabric<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"s6\"><span class=\"cn-tick\"><\u002Fspan>The Framery<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"s7\"><span class=\"cn-tick\"><\u002Fspan>How we operate<\u002Fbutton>\n  <button class=\"cnav-item\" data-target=\"s8\"><span class=\"cn-tick\"><\u002Fspan>Next step<\u002Fbutton>\n<\u002Fdiv>\n\n<script src=\"08fea893-6930-473f-ac42-f906d34af793\"><\u002Fscript>\n<script>\nconst STORE_KEY = 'providence_visitor';\nconst GATE_PASSWORD = 'prov1denceXunframe';\nconst gate = document.getElementById('gate');\nconst stored = localStorage.getItem(STORE_KEY);\nif (stored) {\n  gate.classList.add('hidden');\n} else {\n  document.body.style.overflow = 'hidden';\n  const gateErr = document.getElementById('gateErr');\n  const gPass = document.getElementById('gPass');\n  gPass.addEventListener('input', () => { gateErr.classList.remove('show'); });\n  document.getElementById('gateForm').addEventListener('submit', (e) => {\n    e.preventDefault();\n    if (gPass.value !== GATE_PASSWORD) {\n      gateErr.classList.add('show');\n      gPass.value = '';\n      gPass.focus();\n      return;\n    }\n    localStorage.setItem(STORE_KEY, JSON.stringify({ unlocked: new Date().toISOString() }));\n    gate.classList.add('hidden');\n    document.body.style.overflow = '';\n  });\n}\n\nconst prog = document.getElementById('prog');\nfunction setProg() {\n  const docH = document.documentElement.scrollHeight - window.innerHeight;\n  const p = docH > 0 ? window.scrollY / docH : 0;\n  prog.style.transform = 'scaleX(' + Math.min(1, Math.max(0, p)) + ')';\n}\nwindow.addEventListener('scroll', setProg, { passive: true });\nwindow.addEventListener('resize', setProg);\nsetProg();\n\nconst revealObs = new IntersectionObserver((entries) => {\n  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });\n}, { threshold: 0.1 });\ndocument.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));\n\n// ---------- bullseye ----------\n(function() {\n  const spokes = [\n    {\n      id: 'pcp', name: 'Primary Care', sub: 'The front of the funnel', icon: 'PC',\n      reads: 'Find-a-doc intent across 50+ hospitals, payer mix, and panel availability — normalized into one attributable view.',\n      feeds: 'Referrals into every specialty. The routing source of truth for the whole system.',\n      crossText: 'Cardiology, Oncology, Orthopedics (referrals), Digital Front Door (routing).',\n      cross: [ { id: 'cardio', label: 'referrals' }, { id: 'onc', label: 'referrals' }, { id: 'ortho', label: 'referrals' }, { id: 'fd', label: 'routing' } ]\n    },\n    {\n      id: 'onc', name: 'Oncology', sub: 'Highest acquisition cost', icon: 'ON',\n      reads: 'Search demand, referral patterns, and campaign performance across Adobe, Salesforce, and Google — in one place.',\n      feeds: 'Screening volume and campaign-to-treatment attribution back into the performance layer.',\n      crossText: 'Primary Care (referrals), Women\\'s Health (screening), Front Door (scheduling).',\n      cross: [ { id: 'pcp', label: 'referrals' }, { id: 'wh', label: 'screening' }, { id: 'fd', label: 'scheduling' } ]\n    },\n    {\n      id: 'cardio', name: 'Cardiology', sub: 'High-intent, insurance-sensitive', icon: 'CA',\n      reads: 'Find-a-doc demand, payer-eligibility signals, and provider availability — classified at the point of intent.',\n      feeds: 'Conversion and CAC by campaign back into reporting.',\n      crossText: 'Primary Care (referrals), Emergency (downstream), Front Door (eligibility).',\n      cross: [ { id: 'pcp', label: 'referrals' }, { id: 'er', label: 'downstream' }, { id: 'fd', label: 'eligibility' } ]\n    },\n    {\n      id: 'ortho', name: 'Orthopedics', sub: 'Elective, shoppable demand', icon: 'OR',\n      reads: 'Shoppable-procedure search, review sentiment, and localized content performance.',\n      feeds: 'Booked-procedure attribution and reputation signal.',\n      crossText: 'Primary Care (referrals), Front Door (scheduling), Women\\'s Health (co-demand).',\n      cross: [ { id: 'pcp', label: 'referrals' }, { id: 'fd', label: 'scheduling' }, { id: 'wh', label: 'co-demand' } ]\n    },\n    {\n      id: 'wh', name: 'Women&#39;s Health', sub: 'Relationship + loyalty driver', icon: 'WH',\n      reads: 'Screening reminders, content engagement, and NPS / review signal.',\n      feeds: 'Loyalty and lifetime-value signal across the system.',\n      crossText: 'Oncology (screening), Primary Care (continuity), Front Door (scheduling).',\n      cross: [ { id: 'onc', label: 'screening' }, { id: 'pcp', label: 'continuity' }, { id: 'fd', label: 'scheduling' } ]\n    },\n    {\n      id: 'er', name: 'Emergency &amp; Urgent', sub: 'Access + capacity sensitive', icon: 'ER',\n      reads: 'Real-time demand, wait-time content, and geographic intent.',\n      feeds: 'Access patterns and downstream admissions back into planning.',\n      crossText: 'Front Door (triage), Cardiology (downstream), Primary Care (follow-up).',\n      cross: [ { id: 'fd', label: 'triage' }, { id: 'cardio', label: 'downstream' }, { id: 'pcp', label: 'follow-up' } ]\n    },\n    {\n      id: 'fd', name: 'Digital Front Door', sub: 'Web · app · find-a-doc', icon: 'FD',\n      reads: 'Patient intent across geography, payer, service line, and provider availability — the face of Providence to consumers.',\n      feeds: 'Conversion and CAC signal back into every service line and campaign.',\n      crossText: 'Every service line — the front door is upstream of all of them.',\n      cross: [ { id: 'pcp', label: 'routing' }, { id: 'cardio', label: 'eligibility' }, { id: 'onc', label: 'scheduling' }, { id: 'ortho', label: 'scheduling' }, { id: 'wh', label: 'scheduling' }, { id: 'er', label: 'triage' } ]\n    }\n  ];\n\n    // viewBox 700x600, center 350,300, spoke radius 210, hub radius 92, spoke node radius 30\n  const cx = 350, cy = 300, hubR = 92, spokeR = 210, nodeR = 30;\n  const positions = {};\n  spokes.forEach((s, i) => {\n    const angle = ((i * 360 / spokes.length) - 90) * Math.PI / 180;\n    positions[s.id] = {\n      x: cx + Math.cos(angle) * spokeR,\n      y: cy + Math.sin(angle) * spokeR,\n      angle\n    };\n  });\n\n  const svgNS = 'http://www.w3.org/2000/svg';\n  const spokeLinesG = document.getElementById('spokeLines');\n  if (!spokeLinesG) return;\n  const spokeNodesG = document.getElementById('spokeNodes');\n  const crossFlowG = document.getElementById('crossFlowLines');\n  const labelsContainer = document.getElementById('spokeLabels');\n  const detailEl = document.getElementById('s5detail');\n  const bullseye = document.getElementById('bullseye');\n\n  // draw spoke lines from edge of hub to edge of spoke node\n  spokes.forEach(s => {\n    const p = positions[s.id];\n    const dx = p.x - cx, dy = p.y - cy;\n    const dist = Math.sqrt(dx*dx + dy*dy);\n    const ux = dx / dist, uy = dy / dist;\n    const x1 = cx + ux * hubR;\n    const y1 = cy + uy * hubR;\n    const x2 = p.x - ux * nodeR;\n    const y2 = p.y - uy * nodeR;\n    const line = document.createElementNS(svgNS, 'line');\n    line.setAttribute('x1', x1); line.setAttribute('y1', y1);\n    line.setAttribute('x2', x2); line.setAttribute('y2', y2);\n    line.setAttribute('data-spoke-line', s.id);\n    spokeLinesG.appendChild(line);\n  });\n\n  // draw spoke nodes\n  spokes.forEach(s => {\n    const p = positions[s.id];\n    const g = document.createElementNS(svgNS, 'g');\n    g.setAttribute('class', 'spoke-node');\n    g.setAttribute('data-spoke', s.id);\n    g.setAttribute('transform', `translate(${p.x}, ${p.y})`);\n    const circle = document.createElementNS(svgNS, 'circle');\n    circle.setAttribute('cx', 0); circle.setAttribute('cy', 0);\n    circle.setAttribute('r', nodeR);\n    circle.setAttribute('class', 'spoke-node-bg');\n    const text = document.createElementNS(svgNS, 'text');\n    text.setAttribute('class', 'spoke-node-icon');\n    text.setAttribute('x', 0); text.setAttribute('y', 1);\n    text.textContent = s.icon;\n    g.appendChild(circle);\n    g.appendChild(text);\n    spokeNodesG.appendChild(g);\n  });\n\n  // HTML labels outside spoke nodes\n  spokes.forEach(s => {\n    const p = positions[s.id];\n    // compute label position outside node, further along the angle\n    const labelR = spokeR + 75;\n    const lx = cx + Math.cos(p.angle) * labelR;\n    const ly = cy + Math.sin(p.angle) * labelR;\n    // convert SVG coords (700x600 viewBox) to % of container\n    const xPct = (lx / 700) * 100;\n    const yPct = (ly / 600) * 100;\n    const div = document.createElement('div');\n    div.className = 's5-spoke-label';\n    div.setAttribute('data-spoke-label', s.id);\n    div.style.left = xPct + '%';\n    div.style.top = yPct + '%';\n    div.innerHTML = '<span class=\"ssl-name\">' + s.name + '<\u002Fspan>';\n    labelsContainer.appendChild(div);\n  });\n\n  // build hover handlers\n  function activate(spokeId) {\n    // mark active spoke\n    document.querySelectorAll('.spoke-node').forEach(n => {\n      n.classList.toggle('is-active', n.getAttribute('data-spoke') === spokeId);\n    });\n    // brighten the active center->spoke line, dim others\n    document.querySelectorAll('#spokeLines line').forEach(l => {\n      const id = l.getAttribute('data-spoke-line');\n      l.classList.toggle('is-active', id === spokeId);\n      l.classList.toggle('is-dim', id !== spokeId);\n    });\n    document.querySelectorAll('.s5-spoke-label').forEach(n => {\n      n.classList.toggle('is-active', n.getAttribute('data-spoke-label') === spokeId);\n    });\n\n    // clear and draw cross-flow lines\n    crossFlowG.innerHTML = '';\n    const spoke = spokes.find(s => s.id === spokeId);\n    if (!spoke) return;\n    const from = positions[spokeId];\n    spoke.cross.forEach((target, idx) => {\n      const to = positions[target.id];\n      if (!to) return;\n      // shorten endpoints so they don't enter the nodes\n      const dx = to.x - from.x, dy = to.y - from.y;\n      const dist = Math.sqrt(dx*dx + dy*dy);\n      const ux = dx/dist, uy = dy/dist;\n      const x1 = from.x + ux * nodeR;\n      const y1 = from.y + uy * nodeR;\n      const x2 = to.x - ux * (nodeR + 6);\n      const y2 = to.y - uy * (nodeR + 6);\n      // draw with curve (slight arc)\n      const mx = (x1+x2)/2 + (-uy * 14);\n      const my = (y1+y2)/2 + (ux * 14);\n      const path = document.createElementNS(svgNS, 'path');\n      path.setAttribute('d', `M ${x1} ${y1} Q ${mx} ${my}, ${x2} ${y2}`);\n      path.setAttribute('class', 'cflow-line');\n      path.setAttribute('marker-end', 'url(#arrowGreen)');\n      crossFlowG.appendChild(path);\n      setTimeout(() => path.classList.add('is-visible'), 20 + idx * 70);\n\n      // label\n      const tw = target.label.length * 6 + 14;\n      const bg = document.createElementNS(svgNS, 'rect');\n      bg.setAttribute('x', mx - tw/2);\n      bg.setAttribute('y', my - 8);\n      bg.setAttribute('width', tw);\n      bg.setAttribute('height', 16);\n      bg.setAttribute('rx', 4);\n      bg.setAttribute('class', 'cflow-label-bg');\n      crossFlowG.appendChild(bg);\n      const text = document.createElementNS(svgNS, 'text');\n      text.setAttribute('x', mx);\n      text.setAttribute('y', my);\n      text.setAttribute('class', 'cflow-label');\n      text.textContent = target.label;\n      crossFlowG.appendChild(text);\n      setTimeout(() => { bg.classList.add('is-visible'); text.classList.add('is-visible'); }, 200 + idx * 70);\n    });\n\n    // populate detail panel\n    detailEl.innerHTML = `\n      <div class=\"s5d-active\">\n        <div class=\"s5d-head\">\n          <span class=\"s5d-tag\">Providence · Service line<\u002Fspan>\n          <span class=\"s5d-name\">${spoke.name}<\u002Fspan>\n          <span class=\"s5d-sub\">${spoke.sub}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s5d-row\">\n          <span class=\"s5d-row-tag\">Reads from the platform<\u002Fspan>\n          <span class=\"s5d-row-text\">${spoke.reads}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s5d-row\">\n          <span class=\"s5d-row-tag\">Feeds back<\u002Fspan>\n          <span class=\"s5d-row-text\">${spoke.feeds}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s5d-row\">\n          <span class=\"s5d-row-tag\">Cross-connects<\u002Fspan>\n          <span class=\"s5d-row-text\">${spoke.crossText}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n  }\n\n  function deactivate() {\n    document.querySelectorAll('.spoke-node.is-active, .s5-spoke-label.is-active')\n      .forEach(n => n.classList.remove('is-active'));\n    document.querySelectorAll('#spokeLines line').forEach(l => {\n      l.classList.remove('is-active'); l.classList.remove('is-dim');\n    });\n    crossFlowG.innerHTML = '';\n    detailEl.innerHTML = `\n      <div class=\"s5d-default\">\n        <span class=\"s5d-default-tag\">The through line<\u002Fspan>\n          <span class=\"s5d-default-headline\">Same integrations. Same fabric. Same governance.<\u002Fspan>\n          <span class=\"s5d-default-text\">Automation proven on one service line flows outward to all of them. <strong>Hover any node<\u002Fstrong> to see how the layer lifts it.<\u002Fspan>\n      <\u002Fdiv>\n    `;\n  }\n\n  document.querySelectorAll('.spoke-node').forEach(n => {\n    n.addEventListener('mouseenter', () => activate(n.getAttribute('data-spoke')));\n    n.addEventListener('click', () => activate(n.getAttribute('data-spoke')));\n  });\n  document.querySelectorAll('.s5-spoke-label').forEach(n => {\n    n.style.pointerEvents = 'auto';\n    n.style.cursor = 'pointer';\n    n.addEventListener('mouseenter', () => activate(n.getAttribute('data-spoke-label')));\n    n.addEventListener('click', () => activate(n.getAttribute('data-spoke-label')));\n  });\n  bullseye.addEventListener('mouseleave', deactivate);\n})();\n\n// Draw s3 flow arrows dynamically based on element positions\n(function() {\n  const svg = document.getElementById('s3FlowSvg');\n  if (!svg) return;\n  const container = svg.parentElement; // .s3-flow-arrows\n  const flowRow = container.parentElement; // .s3-flow\n\n  function draw() {\n    const tacs = [...flowRow.querySelectorAll('.s3-tac-col .s3-tac')];\n    const strats = [...flowRow.querySelectorAll('.s3-strat-col .s3-strat')];\n    if (!tacs.length || !strats.length) return;\n\n    const cRect = container.getBoundingClientRect();\n    const w = cRect.width;\n    const h = cRect.height;\n    if (w < 4 || h < 4) return;\n\n    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);\n    svg.setAttribute('width', w);\n    svg.setAttribute('height', h);\n\n    // Clear existing paths (keep <defs>)\n    [...svg.querySelectorAll('path.s3-flow-line')].forEach(n => n.remove());\n\n    const tacYs = tacs.map(el => {\n      const r = el.getBoundingClientRect();\n      return r.top + r.height / 2 - cRect.top;\n    });\n    const stratYs = strats.map(el => {\n      const r = el.getBoundingClientRect();\n      return r.top + r.height / 2 - cRect.top;\n    });\n\n    // All tacticals merge into the vertical center of the strategic column\n    const mergeY = stratYs.reduce((a,b) => a + b, 0) / stratYs.length;\n    const mergeX = w * 0.55;\n    const exitX = w - 2;\n\n    for (const y of tacYs) {\n      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');\n      const d = `M 0 ${y} C ${w * 0.25} ${y}, ${mergeX} ${y}, ${mergeX} ${mergeY} L ${exitX} ${mergeY}`;\n      p.setAttribute('d', d);\n      p.setAttribute('class', 's3-flow-line');\n      p.setAttribute('stroke', '#07358E');\n      p.setAttribute('stroke-width', '2');\n      p.setAttribute('stroke-dasharray', '4 4');\n      p.setAttribute('fill', 'none');\n      p.setAttribute('marker-end', 'url(#arrowEdge)');\n      svg.appendChild(p);\n    }\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', draw);\n  } else {\n    draw();\n  }\n  window.addEventListener('resize', draw);\n  window.addEventListener('load', draw);\n  setTimeout(draw, 500);\n  setTimeout(draw, 1500);\n  if ('ResizeObserver' in window) {\n    const ro = new ResizeObserver(draw);\n    ro.observe(flowRow);\n  }\n})();\n\n// ---------- pains: collapse + rank ----------\n(function() {\n  const list = document.getElementById('painList');\n  if (!list) return;\n  const RANK_KEY = 'prov_pain_ranks';\n  const CUSTOM_KEY = 'prov_pain_custom';\n  let ranks = {};\n  let customs = [];\n  try { ranks = JSON.parse(localStorage.getItem(RANK_KEY)) || {}; } catch (e) { ranks = {}; }\n  try { customs = JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; } catch (e) { customs = []; }\n\n  function save() {\n    try { localStorage.setItem(RANK_KEY, JSON.stringify(ranks)); } catch (e) {}\n    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs)); } catch (e) {}\n  }\n\n  function render() {\n    [...list.querySelectorAll('.pain')].forEach((p, i) => {\n      const id = p.getAttribute('data-pain');\n      const r = ranks[id];\n      const badge = p.querySelector('.pain-rank');\n      const btns = p.querySelectorAll('.pain-rank-btn');\n      if (r) {\n        p.classList.add('ranked');\n        badge.textContent = r;\n        p.style.order = r;\n      } else {\n        p.classList.remove('ranked');\n        badge.textContent = '—';\n        p.style.order = 50 + i;\n      }\n      btns.forEach(b => b.classList.toggle('on', String(r) === b.getAttribute('data-r')));\n    });\n    save();\n  }\n\n  function setRank(id, r) {\n    if (String(ranks[id]) === r) { delete ranks[id]; }\n    else { for (const k in ranks) { if (String(ranks[k]) === r) delete ranks[k]; } ranks[id] = Number(r); }\n    render();\n  }\n\n  function wire(p) {\n    const id = p.getAttribute('data-pain');\n    const head = p.querySelector('.pain-head');\n    head.addEventListener('click', (e) => {\n      if (e.target.closest('.pain-ranker') || e.target.closest('.pain-remove') || e.target.closest('.pain-title-input')) return;\n      if (p.querySelector('.pain-body')) p.classList.toggle('open');\n    });\n    p.querySelectorAll('.pain-rank-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => { e.stopPropagation(); setRank(id, btn.getAttribute('data-r')); });\n    });\n    const rm = p.querySelector('.pain-remove');\n    if (rm) rm.addEventListener('click', (e) => {\n      e.stopPropagation();\n      delete ranks[id];\n      customs = customs.filter(c => c.id !== id);\n      p.remove();\n      render();\n    });\n  }\n\n  const rankerHTML = '<span class=\"pain-ranker\"><span class=\"pain-ranker-hint\">Rank<\u002Fspan>' +\n    [1,2,3,4,5].map(n => '<button class=\"pain-rank-btn\" data-r=\"'+n+'\">'+n+'<\u002Fbutton>').join('') + '<\u002Fspan>';\n\n  function makeCustom(c, focus) {\n    const art = document.createElement('article');\n    art.className = 'pain is-custom';\n    art.setAttribute('data-pain', c.id);\n    art.innerHTML =\n      '<div class=\"pain-head\">' +\n        '<span class=\"pain-rank\">—<\u002Fspan>' +\n        '<span class=\"pain-titlewrap\"><span class=\"pain-tag\">Your addition<\u002Fspan>' +\n          '<input class=\"pain-title-input\" type=\"text\" placeholder=\"Type the pressure on your seat…\" value=\"'+(c.title||'').replace(/\"/g,'&quot;')+'\"><\u002Fspan>' +\n        rankerHTML +\n        '<button class=\"pain-remove\" title=\"Remove\" aria-label=\"Remove\">×<\u002Fbutton>' +\n      '<\u002Fdiv>';\n    addBtn.before(art);\n    const input = art.querySelector('.pain-title-input');\n    input.addEventListener('input', () => {\n      const obj = customs.find(x => x.id === c.id);\n      if (obj) { obj.title = input.value; save(); }\n    });\n    wire(art);\n    if (focus) input.focus();\n  }\n\n  // existing static pains\n  [...list.querySelectorAll('.pain')].forEach(wire);\n\n  // add button\n  const addBtn = document.createElement('button');\n  addBtn.className = 'pain-add';\n  addBtn.id = 'painAdd';\n  addBtn.innerHTML = '<span class=\"pain-add-icon\">+<\u002Fspan> Add a pressure of your own';\n  list.appendChild(addBtn);\n  addBtn.addEventListener('click', () => {\n    const c = { id: 'c' + Date.now(), title: '' };\n    customs.push(c);\n    makeCustom(c, true);\n    render();\n  });\n\n  // restore saved custom pains\n  customs.forEach(c => makeCustom(c, false));\n\n  render();\n})();\n\n// ---------- knowledge fabric connector lines ----------\n(function() {\n  const flow = document.getElementById('kfFlow');\n  const svg = document.getElementById('kfLines');\n  if (!flow || !svg) return;\n  const NS = 'http://www.w3.org/2000/svg';\n  function center(el, side) {\n    const fr = flow.getBoundingClientRect();\n    const r = el.getBoundingClientRect();\n    return { x: (side === 'r' ? r.right : r.left) - fr.left, y: r.top - fr.top + r.height / 2 };\n  }\n  function link(a, b) {\n    const p = document.createElementNS(NS, 'path');\n    const mx = (a.x + b.x) / 2;\n    p.setAttribute('d', `M ${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`);\n    p.setAttribute('fill', 'none');\n    p.setAttribute('stroke', '#c2ccd5');\n    p.setAttribute('stroke-width', '1.4');\n    svg.appendChild(p);\n  }\n  function q(sel) { return [...flow.querySelectorAll(sel)]; }\n  function draw() {\n    const fr = flow.getBoundingClientRect();\n    if (fr.width < 4) return;\n    svg.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);\n    while (svg.firstChild) svg.removeChild(svg.firstChild);\n    const A = q('[data-kf=\"a0\"]')[0];\n    const B = q('[data-kf-col=\"b\"] .kf-node');\n    const C = q('.kf-bucket');\n    const D = q('[data-kf=\"d0\"]')[0];\n    if (!A || !D) return;\n    B.forEach(b => link(center(A, 'r'), center(b, 'l')));\n    B.forEach(b => C.forEach(c => link(center(b, 'r'), center(c, 'l'))));\n    C.forEach(c => link(center(c, 'r'), center(D, 'l')));\n  }\n  draw();\n  window.addEventListener('resize', draw);\n  window.addEventListener('load', draw);\n  setTimeout(draw, 400); setTimeout(draw, 1200);\n  if ('IntersectionObserver' in window) {\n    new IntersectionObserver(draw).observe(flow);\n  }\n})();\n\nconst sIds = ['scxo','s2','s4','sfail','sapproach','sstack','sfabric','s6','s7','s8'];\nconst sLabels = ['CXO priorities','What\\'s pressing','AI maturity','Why AI fails','The approach','Solution stack','Knowledge fabric','The Framery','How we operate','Next step'];\nconst sections = document.querySelectorAll('section[id]');\nconst cnItems  = document.querySelectorAll('.cnav-item');\n\nconst navDotsEl = document.getElementById('navDots');\nsIds.forEach((id, i) => {\n  const btn = document.createElement('button');\n  btn.className = 'nav-dot';\n  btn.title = sLabels[i];\n  btn.addEventListener('click', () => document.getElementById(id).scrollIntoView({ behavior: 'smooth' }));\n  navDotsEl.appendChild(btn);\n});\nconst navDots = navDotsEl.querySelectorAll('.nav-dot');\n\ncnItems.forEach(item => {\n  item.addEventListener('click', () => {\n    const t = item.getAttribute('data-target');\n    if (t) document.getElementById(t).scrollIntoView({ behavior: 'smooth' });\n  });\n});\n\nconst sectionObs = new IntersectionObserver((entries) => {\n  entries.forEach(e => {\n    if (e.isIntersecting && e.intersectionRatio >= 0.4) {\n      const idx = sIds.indexOf(e.target.id);\n      if (idx < 0) return;\n      navDots.forEach((d, i) => d.classList.toggle('active', i === idx));\n      cnItems.forEach((d, i) => d.classList.toggle('active', i === idx));\n    }\n  });\n}, { threshold: 0.4 });\nsections.forEach(s => sectionObs.observe(s));\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
