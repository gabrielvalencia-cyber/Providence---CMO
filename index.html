  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"6\"] { transition-delay: .48s; }\n\n/* breadcrumb */\n.breadcrumb {\n  display: inline-flex; align-items: center; flex-wrap: wrap;\n  gap: 8px;\n  font: 700 10px/1.3 var(--font);\n  letter-spacing: .12em; text-transform: uppercase;\n  margin-bottom: 28px;\n}\n.breadcrumb .bc-step {\n  color: var(--text4);\n  transition: color .3s;\n}\n.breadcrumb .bc-step.active {\n  color: var(--brand);\n  position: relative;\n}\n.breadcrumb .bc-step.active::after {\n  content: '';\n  display: block;\n  margin-top: 6px;\n  height: 2px;\n  background: var(--brand);\n  border-radius: 1px;\n}\n.breadcrumb .bc-sep {\n  color: var(--text4);\n  opacity: .4;\n  font-weight: 400;\n}\n\n/* section heading block */\n.section-hed {\n  font: 800 var(--t-h1)/1.05 var(--font);\n  letter-spacing: -.03em; color: var(--text1);\n  margin-bottom: 10px;\n}\n.section-hed em { font-style: normal; color: var(--brand); }\n.section-sub {\n  font: 400 var(--t-body-lg)/1.5 var(--font); color: var(--text2);\n  max-width: 800px; margin-bottom: 32px;\n}\n\n/* live badge */\n.live-badge {\n  position: absolute; top: 70px; right: 32px;\n  display: inline-flex; align-items: center; gap: 8px;\n  font: 700 10px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  padding: 8px 12px; border-radius: 999px;\n  background: var(--brand); color: #fff;\n  z-index: 5;\n  box-shadow: 0 4px 12px -4px rgba(239,62,53,.4);\n}\n.live-badge::before {\n  content: ''; width: 7px; height: 7px; border-radius: 50%;\n  background: var(--accent-bright);\n  box-shadow: 0 0 0 3px rgba(251,191,36,.32);\n  animation: livePulse 2s infinite;\n}\n@keyframes livePulse {\n  0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,.55); }\n  50%      { box-shadow: 0 0 0 6px rgba(251,191,36,0); }\n}\n\n/* ============================================================\n   SECTION 1 — Where we started — horizontal timeline\n   ============================================================ */\n.s1-callouts {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\n  margin-bottom: 36px;\n}\n.s1-co {\n  border-radius: 12px;\n  padding: 18px 24px;\n  display: flex; flex-direction: column; gap: 4px;\n}\n.s1-co.is-strategy {\n  background: var(--neutral-bg);\n  border: 1px solid var(--border);\n}\n.s1-co.is-execution {\n  background: var(--brand-dim);\n  border: 1px solid var(--brand-soft);\n}\n.s1-co .s1co-tag {\n  font: 700 9px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--text4);\n  margin-bottom: 4px;\n}\n.s1-co.is-execution .s1co-tag { color: var(--brand); }\n.s1-co .s1co-title {\n  font: 700 17px/1.25 var(--font);\n  letter-spacing: -.015em;\n  color: var(--text1);\n}\n.s1-co.is-execution .s1co-title { color: var(--brand); }\n.s1-co .s1co-body {\n  font: 400 13px/1.5 var(--font);\n  color: var(--text3);\n}\n\n.tl-track {\n  position: relative;\n  padding: 36px 0 12px;\n}\n.tl-line {\n  position: absolute;\n  top: 56px; left: 6%; right: 6%;\n  height: 2px;\n  background: linear-gradient(to right,\n    var(--brand) 0%,\n    var(--brand) 50%,\n    var(--neutral) 50%,\n    var(--neutral) 100%);\n  z-index: 0;\n}\n.tl-stops {\n  display: grid; grid-template-columns: repeat(3, 1fr);\n  position: relative; z-index: 1;\n}\n.tl-stop {\n  display: flex; flex-direction: column;\n  align-items: center; text-align: center;\n  padding: 0 20px;\n}\n.tl-when {\n  font: 700 10px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--text4);\n  margin-bottom: 14px;\n  padding: 6px 12px;\n  background: var(--surface);\n  border-radius: 999px;\n  border: 1px solid var(--border);\n}\n.tl-stop.is-now .tl-when {\n  background: var(--brand); color: #fff; border-color: var(--brand);\n}\n.tl-dot {\n  width: 26px; height: 26px; border-radius: 50%;\n  background: var(--surface);\n  border: 2px solid var(--neutral);\n  display: flex; align-items: center; justify-content: center;\n  margin-bottom: 18px;\n}\n.tl-stop.is-done .tl-dot {\n  background: var(--brand); er-spacing: .14em; text-transform: uppercase;\n  display: inline-flex; align-items: center; gap: 6px;\n}\n.s5-co.is-aligned .s5co-tag { color: var(--brand); }\n.s5-co.is-timing .s5co-tag { color: var(--accent-bright); }\n.s5co-text {\n  font: 400 13px/1.5 var(--font);\n}\n.s5-co.is-aligned .s5co-text { color: var(--text2); }\n.s5-co.is-aligned .s5co-text strong { color: var(--brand); font-weight: 700; }\n.s5-co.is-timing .s5co-text { color: rgba(255,255,255,.82); }\n.s5-co.is-timing .s5co-text strong { color: #fff; font-weight: 700; }\n\n.s5-stage {\n  display: grid; grid-template-columns: 1.4fr 1fr;\n  gap: 28px;\n  align-items: center;\n  min-height: 540px;\n}\n.s5-bullseye {\n  position: relative;\n  width: 100%;\n  max-width: 640px;\n  aspect-ratio: 700 / 600;\n  margin: 0 auto;\n}\n.s5-bullseye svg {\n  width: 100%; height: 100%;\n  display: block;\n}\n\n/* hub label */\n.s5-hub-label {\n  position: absolute;\n  top: 50%; left: 50%;\n  transform: translate(-50%, -50%);\n  text-align: center;\n  width: 170px;\n  pointer-events: none;\n  z-index: 3;\n}\n.s5hl-tag {\n  font: 700 8px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--accent-bright);\n  margin-bottom: 6px;\n}\n.s5hl-name {\n  font: 800 14px/1.15 var(--font);\n  color: #fff;\n  letter-spacing: -.015em;\n  margin-bottom: 4px;\n}\n.s5hl-detail {\n  font: 600 10px/1.3 var(--font);\n  color: rgba(255,255,255,.72);\n  letter-spacing: -.005em;\n}\n\n/* spoke labels (HTML over SVG) */\n.s5-spoke-labels {\n  position: absolute; inset: 0;\n  pointer-events: none;\n}\n.s5-spoke-label {\n  position: absolute;\n  transform: translate(-50%, -50%);\n  text-align: center;\n  width: 110px;\n  pointer-events: none;\n}\n.s5-spoke-label .ssl-name {\n  font: 700 11px/1.2 var(--font);\n  color: var(--text1);\n  letter-spacing: -.005em;\n  margin-bottom: 2px;\n}\n.s5-spoke-label.is-active .ssl-name {\n  color: var(--brand);\n}\n\n/* spoke nodes inside the SVG */\n.spoke-node {\n  cursor: pointer;\n  transition: r .2s ease, fill .2s ease;\n}\n.spoke-node-bg {\n  fill: #fff;\n  stroke: #b9c2bc;\n  stroke-width: 2;\n  transition: fill .2s ease, stroke .2s ease;\n}\n.spoke-node.is-active .spoke-node-bg {\n  fill: var(--brand);\n  stroke: var(--brand);\n}\n.spoke-node-icon {\n  fill: var(--brand);\n  font: 700 13px/1 var(--font);\n  text-anchor: middle;\n  dominant-baseline: central;\n  pointer-events: none;\n  transition: fill .2s ease;\n}\n.spoke-node.is-active .spoke-node-icon {\n  fill: #fff;\n}\n\n/* cross-flow lines */\n.cflow-line {\n  fill: none;\n  stroke: var(--accent);\n  stroke-width: 1.8;\n  opacity: 0;\n  transition: opacity .35s ease;\n}\n.cflow-line.is-visible { opacity: 0.85; animation: cfDraw .55s ease forwards; }\n@keyframes cfDraw {\n  from { stroke-dasharray: 1 999; stroke-dashoffset: 999; }\n  to   { stroke-dasharray: 999 0; stroke-dashoffset: 0; }\n}\n.cflow-label {\n  font: 700 9px/1 var(--font);\n  letter-spacing: .04em;\n  text-transform: uppercase;\n  fill: var(--brand);\n  text-anchor: middle;\n  dominant-baseline: central;\n  opacity: 0;\n  transition: opacity .35s ease;\n}\n.cflow-label.is-visible { opacity: 1; }\n.cflow-label-bg {\n  fill: #fff;\n  stroke: var(--brand-soft);\n  stroke-width: 1;\n  opacity: 0;\n  transition: opacity .35s ease;\n}\n.cflow-label-bg.is-visible { opacity: 1; }\n\n/* detail panel */\n.s5-detail {\n  background: var(--surface);\n  border: 1.5px solid var(--brand-soft);\n  border-radius: 14px;\n  padding: 22px 24px;\n  min-height: 380px;\n  display: flex; flex-direction: column;\n  gap: 14px;\n  box-shadow: var(--shadow-lg);\n}\n.s5d-default {\n  display: flex; flex-direction: column;\n  gap: 8px;\n  justify-content: center;\n  flex: 1;\n}\n.s5d-default-tag {\n  font: 700 10px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--brand);\n}\n.s5d-default-text {\n  font: 500 14px/1.5 var(--font);\n  color: var(--text2);\n}\n.s5d-active {\n  display: flex; flex-direction: column;\n  gap: 14px;\n  animation: s5dFade .35s ease;\n}\n@keyframes s5dFade {\n  from { opacity: 0; transform: translateY(6px); }\n  to   { opacity: 1; transform: none; }\n}\n.s5d-head {\n  display: flex; flex-direction: column; gap: 4px;\n  padding-bottom: 12px;\n  border-bottom: 1px solid var(--border);\n}\n.s5d-tag {\n  font: 700 9px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--brand);\n}\n.s5d-name {\n  font: 800 18px/1.2 var(--font);\n  color: var(--text1);\n  letter-spacing: -.02em;\n}\n.s5d-sub {\n  font: 500 12px/1.3 var(--font);\n  color: var(--text3);\n}\n.s5d-row {\n  display: flex; flex-direction: column; gap: 4px;\n}\n.s5d-row-tag {\n  font: 700 9px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--accent);\n}\n.s5d-row-text {\n  font: 400 12.5px/1.5 var(--font);\n  color: var(--text2);\n}\n.s5d-row-text strong { color: var(--text1); font-weight: 600; }\n\n/* full-width footer */\n.s5-footer-band {\n  margin-top: 32px;\n  padding: 24px 32px;\n  background: var(--brand);\n  color: #fff;\n  border-radius: 14px;\n  text-align: center;\n  font: 700 clamp(18px, 1.6vw, 24px)/1.3 var(--font);\n  letter-spacing: -.015em;\n}\n.s5fb-text strong { color: var(--accent-bright); font-weight: 800; }\n\n/* SECTION 5 — through-line additions */\n.s5-narrative {\n  display: flex; align-items: center; gap: 14px;\n  padding: 14px 22px;\n  background: var(--brand-dim);\n  border-left: 4px solid var(--brand);\n  border-radius: 0 12px 12px 0;\n  margin-bottom: 20px;\n}\n.s5n-arrow {\n  font: 800 22px/1 var(--font);\n  color: var(--brand);\n  flex-shrink: 0;\n  animation: s5nArrow 2.4s infinite ease-in-out;\n}\n@keyframes s5nArrow {\n  0%, 100% { transform: translateX(0); }\n  50%      { transform: translateX(4px); }\n}\n.s5n-text {\n  font: 500 14px/1.55 var(--font);\n  color: var(--text1);\n  letter-spacing: -.005em;\n}\n.s5n-text strong { color: var(--brand); font-weight: 700; }\n\n/* Outward-flowing spoke lines (default state) */\n#spokeLines line {\n  stroke-dasharray: 8 6;\n  stroke-dashoffset: 0;\n  animation: spokeFlow 3s linear infinite;\n  transition: stroke .25s ease, stroke-width .25s ease, opacity .25s ease;\n}\n@keyframes spokeFlow {\n  to { stroke-dashoffset: -28; }\n}\n#spokeLines line.is-active {\n  stroke: var(--brand);\n  stroke-width: 2.5;\n  opacity: 1;\n}\n#spokeLines line.is-dim {\n  opacity: .35;\n}\n\n/* default detail panel additions */\n.s5d-default-headline {\n  font: 700 17px/1.3 var(--font);\n  color: var(--text1);\n  letter-spacing: -.015em;\n  margin-top: 4px;\n}\n.s5d-default-text strong {\n  color: var(--brand);\n  font-weight: 700;\n}\n\n/* Section 6 tooltips */\n.fw-managed, .fw-block { position: relative; cursor: pointer; }\n.fw-managed:hover, .fw-block:hover { z-index: 9999 !important; }\n.fw-os-row { position: relative; }\n.fw-os-row:has(.fw-block:hover) { z-index: 9999 !important; }\n.fw-tip { z-index: 9999 !important; }\n.fw-managed::after, .fw-block::after {\n  content: 'ℹ';\n  position: absolute;\n  top: 8px; right: 10px;\n  width: 16px; height: 16px;\n  display: flex; align-items: center; justify-content: center;\n  border-radius: 50%;\n  background: rgba(255,255,255,.18);\n  color: #fff;\n  font: 700 10px/1 var(--font);\n  pointer-events: none;\n  opacity: .7;\n  transition: opacity .15s, background .15s;\n}\n.fw-block.is-ml::after { background: rgba(239,62,53,.18); color: var(--brand); }\n.fw-managed:hover::after, .fw-block:hover::after {\n  opacity: 1;\n  background: rgba(255,255,255,.32);\n}\n.fw-block.is-ml:hover::after { background: rgba(239,62,53,.32); }\n\n.fw-tip {\n  position: absolute;\n  left: 50%;\n  width: 380px;\n  max-width: calc(100vw - 60px);\n  background: var(--ink-1);\n  color: #fff;\n  padding: 16px 20px;\n  border-radius: 12px;\n  box-shadow: 0 14px 36px -10px rgba(8,24,48,.45);\n  opacity: 0;\n  pointer-events: none;\n  z-index: 50;\n  transition: opacity .25s ease, transform .25s ease;\n  transform: translateX(-50%);\n}\n.fw-tip.is-below {\n  top: calc(100% + 12px);\n}\n.fw-tip.is-above {\n  bottom: calc(100% + 12px);\n}\n.fw-managed:hover > .fw-tip,\n.fw-block:hover > .fw-tip {\n  opacity: 1;\n}\n.fw-managed:hover > .fw-tip.is-below,\n.fw-block:hover > .fw-tip.is-below {\n  transform: translateX(-50%) translateY(2px);\n}\n.fw-managed:hover > .fw-tip.is-above,\n.fw-block:hover > .fw-tip.is-above {\n  transform: translateX(-50%) translateY(-2px);\n}\n.fw-tip::before {\n  content: '';\n  position: absolute;\n  left: 50%;\n  margin-left: -7px;\n  width: 14px; height: 14px;\n  background: var(--ink-1);\n  transform: rotate(45deg);\n}\n.fw-tip.is-below::before { top: -6px; }\n.fw-tip.is-above::before { bottom: -6px; }\n.fw-tip-head {\n  display: block;\n  font: 700 13px/1.35 var(--font);\n  color: var(--accent-bright);\n  margin-bottom: 12px;\n  letter-spacing: -.005em;\n}\n.fw-tip ul {\n  list-style: none; padding: 0; margin: 0;\n  display: flex; flex-direction: column;\n  gap: 7px;\n}\n.fw-tip li {\n  font: 400 12px/1.5 var(--font);\n  color: rgba(255,255,255,.85);\n  padding-left: 14px;\n  position: relative;\n}\n.fw-tip li::before {\n  content: '';\n  position: absolute;\n  left: 0; top: 8px;\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: var(--accent-bright);\n}\n\n/* gate */\n#gate {\n  position: fixed; inset: 0; z-index: 9999;\n  display: flex; align-items: center; justify-content: center;\n  background: rgba(247,248,246,0.72);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  transition: opacity .35s ease, visibility .35s ease;\n}\n#gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }\n.gate-card {\n  background: #fff; border: 1px solid var(--border); border-radius: 20px;\n  padding: 44px 48px 40px; width: min(480px, calc(100vw - 40px));\n  box-shadow: 0 8px 40px rgba(8,24,48,.10);\n  display: flex; flex-direction: column; gap: 28px;\n}\n.gate-lockup { display: flex; align-items: center; gap: 12px; }\n.gate-lockup .gx { font: 500 18px/1 var(--font); color: var(--text4); }\n.gate-lockup .client { font: 700 16px/1 var(--font); color: var(--text1); letter-spacing: -.02em; }\n.gate-lockup .client-logo { width: 26px; height: 26px; object-fit: contain; }\n.nav-brand .client-logo { width: 22px; height: 22px; object-fit: contain; }\n.gate-body h2 {\n  font: 700 26px/1.2 var(--font); color: var(--text1);\n  letter-spacing: -.02em; margin-bottom: 8px;\n}\n.gate-body p { font: 400 14px/1.5 var(--font); color: var(--text3); }\n.gate-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }\n.gate-field label {\n  font: 700 11px/1 var(--font); letter-spacing:.1em;\n  text-transform:uppercase; color:var(--text3);\n  display:block; margin-bottom:6px;\n}\n.gate-field input {\n  width:100%; padding:12px 14px;\n  border:1.5px solid var(--border); border-radius:9px;\n  font:400 14px/1 var(--font); color:var(--text1);\n  outline:none; transition: border-color .15s, box-shadow .15s;\n  background: #fff;\n}\n.gate-field input:focus {\n  border-color:var(--brand);\n  box-shadow: 0 0 0 4px rgba(239,62,53,.12);\n}\n#gateBtn {\n  margin-top:4px; padding:13px 20px;\n  background:var(--brand); color:#fff;\n  border:none; border-radius:10px;\n  font:700 14px/1 var(--font); cursor:pointer;\n  transition:background .15s, transform .15s;\n}\n#gateBtn:hover { background:var(--brand-hover); transform: translateY(-1px); }\n.gate-note { font:400 12px/1.5 var(--font); color:var(--text4); text-align:center; }\n.gate-err { font:500 12.5px/1.4 var(--font); color:var(--red); margin-top:-4px; display:none; }\n.gate-err.show { display:block; }\n\n/* ============================================================\n   SECTION 6 — The Framery — aligned grid layout\n   ============================================================ */\n.framery-wrap {\n  display: grid;\n  grid-template-columns: 170px 56px 1fr 220px;\n  grid-template-rows: auto auto auto auto;\n  column-gap: 14px;\n  row-gap: 16px;\n  align-items: stretch;\n  position: relative;\n}\n\n/* row placements */\n.fw-row-1 { grid-row: 1; }\n.fw-row-2 { grid-row: 2; }\n.fw-row-3 { grid-row: 3; }\n.fw-row-4 { grid-row: 4; }\n\n/* column placements */\n.fw-side-card.is-left { grid-column: 1; }\n.fw-arrow { grid-column: 2; display: flex; align-items: center; }\n.fw-managed,\n.fw-os-row,\n.fw-block.is-knowledge,\n.fw-block.is-data { grid-column: 3; }\n\n.fw-side-card {\n  background: var(--ink-1);\n  color: #fff;\n  border-radius: 12px;\n  padding: 14px 16px;\n  display: flex; flex-direction: column; justify-content: center;\n  gap: 4px;\n  box-shadow: var(--shadow);\n  position: relative;\n  z-index: 1;\n}\n.fwsc-tag {\n  font: 700 9px/1 var(--font);\n  letter-spacing: .14em; text-transform: uppercase;\n  color: var(--accent-bright);\n}\n.fwsc-name {\n  font: 700 14px/1.2 var(--font);\n  color: #fff;\n  letter-spacing: -.01em;\n}\n\n/* center blocks */\n.fw-managed {\n  background: var(--accent);\n  border-radius: 12px;\n  padding: 14px 16px;\n  display: flex; flex-direction: column; gap: 10px;\n  position: relative;\n  z-index: 1;\n}\n.fw-block-head {\n  display: flex; align-items: center; justify-content: center;\n  gap: 8px;\n  color: #fff;\n  font: 800 12px/1 var(--font);\n  letter-spacing: -.005em;\n}\n.fw-block-head .fwbh-icon { color: #fff; }\n.fw-block-row {\n  display: grid; grid-template-columns: repeat(3, 1fr);\n  gap: 8px;\n}\n.fw-block-row.cols-4 { grid-template-columns: repeat(4, 1fr); }\n.fw-block-row.cols-2 { grid-template-columns: repeat(2, 1fr); }\n.fw-block-row.cols-1 { grid-template-columns: 1fr; }\n.fw-chip {\n  padding: 10px 8px;\n  border-radius: 6px;\n  background: #fff;\n  text-align: center;\n  font: 700 11px/1.2 var(--font);\n  color: var(--text1);\n  letter-spacing: -.005em;\n}\n\n.fw-os-row {\n  display: grid; grid-template-columns: 1.6fr 1fr;\n  gap: 10px;\n  position: relative;\n  z-index: 1;\n}\n.fw-block {\n  border-radius: 12px;\n  padding: 14px;\n  display: flex; flex-direction: column; gap: 10px;\n}\n.fw-block.is-agents { background: var(--brand); }\n.fw-block.is-ml { background: var(--accent-bright); }\n.fw-block.is-ml .fw-block-head { color: var(--brand); }\n.fw-block.is-knowledge { background: var(--ink-2); position: relative; z-index: 1; }\n.fw-block.is-data { background: var(--brand-hover); position: relative; z-index: 1; }\n\n/* Framery OS outer frame — spans rows 2-4 col 3 */\n.fw-os-frame {\n  grid-column: 3;\n  grid-row: 2 / 5;\n  border: 1.5px solid var(--border-strong);\n  border-radius: 14px;\n  margin: -8px;\n  background: rgba(0, 63, 45, 0.02);\n  pointer-events: none;\n  z-index: 0;\n}\n.fw-os-tag-floating {\n  grid-column: 3;\n  grid-row: 2;\n  background: var(--ink-1);\n  color: #fff;\n  padding: 5px 12px;\n  border-radius: 6px;\n  font: 700 10px/1 var(--font);\n  letter-spacing: .04em;\n  display: inline-flex; align-items: center; gap: 6px;\n  justify-self: start;\n  align-self: start;\n  margin-left: 14px;\n  margin-top: -10px;\n  z-index: 2;\n  width: fit-content;\n}\n.fw-os-tag-floating strong { font-weight: 800; color: #fff; }\n.fw-os-tag-floating em { font-style: normal; color: var(--accent-bright); font-weight: 600; }\n\n/* right column spans rows 1-4 */\n.fw-right-col {\n  grid-column: 4;\n  grid-row: 1 / 5;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: 14px;\n  padding: 18px 16px;\n  display: flex; flex-direction: column;\n  box-shadow: var(--shadow);\n  position: relative;\n  z-index: 1;\n}\n.fw-col-head {\n  font: 700 12px/1.2 var(--font);\n  color: var(--text1);\n  letter-spacing: -.005em;\n  padding-bottom: 12px;\n  margin-bottom: 14px;\n  border-bottom: 1px solid var(--border);\n  display: flex; align-items: center; gap: 8px;\n}\n.fw-col-head .fwch-icon {\n  width: 22px; height: 22px;\n  border-radius: 6px;\n  background: var(--brand-dim);\n  color: var(--brand);\n  display: flex; align-items: center; justify-content: center;\n  font: 800 11px/1 var(--font);\n}\n.fw-col-items {\n  display: flex; flex-direction: column;\n  gap: 10px;\n  flex: 1;\n  justify-content: center;\n}\n.fw-col-item {\n  padding: 10px 12px;\n  border-radius: 8px;\n  font: 700 11px/1.2 var(--font);\n  letter-spacing: .01em;\n  text-align: center;\n  background: var(--surface-subtle);\n  color: var(--text2);\n  border: 1px solid var(--border);\n}\n\n/* mobile */\n@media (max-width: 1100px) {\n  .framery-wrap {\n    grid-template-columns: 1fr;\n    grid-template-rows: auto;\n  }\n  .fw-row-1, .fw-row-2, .fw-row-3, .fw-row-4 { grid-row: auto; }\n  .fw-side-card.is-left, .fw-managed, .fw-os-row,\n  .fw-block.is-knowledge, .fw-block.is-data,\n  .fw-right-col, .fw-os-frame, .fw-os-tag-floating { grid-column: 1; grid-row: auto; }\n  .fw-os-frame { display: none; }\n  .fw-arrow { display: none; }\n}\n\n/* mobile */\n@media (max-width: 1100px) {\n  .s5-stage { grid-template-columns: 1fr; }\n}\n@media (max-width: 960px) {\n  section { min-height: auto; padding: 88px 0 56px; overflow: visible; }\n  .s5-callouts-row { grid-template-columns: 1fr; }\n  .s5-stage { grid-template-columns: 1fr; min-height: auto; gap: 18px; }\n  .s5-bullseye { max-width: 100%; }\n  .s5-detail { min-height: auto; }\n  nav.topnav { padding: 0 16px; }\n  .nav-label { display: none; }\n  .cnav { display: none; }\n  .live-badge { top: 60px; right: 16px; }\n  .breadcrumb { font-size: 9px; }\n  .s1-callouts { grid-template-columns: 1fr; }\n  .tl-stops { grid-template-columns: 1fr; gap: 28px; }\n  .tl-line { display: none; }\n  .s2-split { grid-template-columns: 1fr; }\n  .s2-area-grid { grid-template-columns: 1fr; }\n  .s2-tiles { grid-template-columns: 1fr; }\n  .s3-flow-row { grid-template-columns: 1fr 1fr; }\n  .s3-flow { grid-template-columns: 1fr; }\n  .s3-flow-arrows { display: none; }\n  .s4-lanes { grid-template-columns: repeat(4, 1fr); }\n  .s4-hed-row { grid-template-columns: 1fr; gap: 18px; }\n  .s4-phase-bands { grid-template-columns: 1fr; }\n  .s4-band.is-phase1, .s4-band.is-phase2, .s4-band.is-phase3 { grid-column: 1; }\n  .s4-tl-axis { grid-template-columns: repeat(3, 1fr); }\n}\n/* pains: add + custom */\n.pain-add {\n  display: flex; align-items: center; gap: 10px;\n  width: 100%; margin-top: 2px;\n  background: transparent; border: 1.5px dashed var(--border-strong);\n  border-radius: 14px; padding: 15px 20px; cursor: pointer;\n  font: 700 13.5px/1 var(--font); color: var(--text3); letter-spacing: -.01em;\n  transition: border-color .2s, color .2s, background .2s;\n}\n.pain-add:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-dim); }\n.pain-add-icon {\n  width: 24px; height: 24px; border-radius: 50%; flex: none;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--brand); color: #fff; font: 700 17px/1 var(--font);\n}\n.pain.is-custom { border-left-color: var(--accent); }\n.pain.is-custom.ranked .pain-rank { background: var(--accent); }\n.pain.is-custom .pain-tag { color: var(--accent); }\n.pain-title-input {\n  font: 700 15.5px/1.3 var(--font); color: var(--text1); letter-spacing: -.01em;\n  border: none; background: transparent; width: 100%; padding: 2px 0;\n  border-bottom: 1px solid var(--border); outline: none;\n}\n.pain-title-input:focus { border-bottom-color: var(--accent); }\n.pain-remove {\n  width: 26px; height: 26px; border-radius: 7px; flex: none;\n  border: 1px solid var(--border-strong); background: var(--surface);\n  color: var(--text4); font: 400 18px/1 var(--font); cursor: pointer;\n  transition: all .15s;\n}\n.pain-remove:hover { border-color: var(--red); color: var(--red); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div id=\"prog\"><\u002Fdiv>\n\n<div id=\"gate\">\n  <div class=\"gate-card\">\n    <div class=\"gate-lockup\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 35 35\" fill=\"none\">\n        <defs>\n          <linearGradient id=\"gg\" x1=\"8\" y1=\"7\" x2=\"27\" y2=\"29\" gradientUnits=\"userSpaceOnUse\">\n            <stop offset=\"0%\" stop-color=\"#07358E\"><\u002Fstop>\n            <stop offset=\"60%\" stop-color=\"#052a73\"><\u002Fstop>\n            <stop offset=\"100%\" stop-color=\"#5CB24A\"><\u002Fstop>\n          <\u002FlinearGradient>\n        <\u002Fdefs>\n        <path d=\"M26.2494 18.7481C26.2745 21.5014 25.4532 23.7153 23.8543 25.3898C22.2618 27.0643 20.1739 27.8859 17.5781 27.8859C14.9823 27.8859 12.7941 27.0643 11.1702 25.3898C9.55255 23.7153 8.75 21.5014 8.75 18.723V7.91699H12.9697V18.6478C12.9697 20.2721 13.3835 21.5578 14.2299 22.5048C15.0764 23.4581 16.1862 23.9222 17.5718 23.9222C18.8822 23.9222 19.9356 23.4581 20.7382 22.5048C21.5344 21.5515 21.9483 20.2659 21.9483 18.6478V7.91699H26.193L26.2432 18.7481H26.2494Z\" fill=\"url(#gg)\"><\u002Fpath>\n      <\u002Fsvg>\n      <span class=\"nav-wordmark\">Unframe<\u002Fspan>\n      <span class=\"gx\">×<\u002Fspan>\n      <img class=\"client-logo\" src=\"4e7ed1fc-914f-4ab3-914c-55ffdbfccbfe\" alt=\"\" width=\"26\" height=\"26\">\n      <span class=\"client\">Providence<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"gate-body\">\n      <h2>AI Delivery Briefing<\u002Fh2>\n      <p>Recap of our conversation, the use cases that surfaced, and where they fit the broader operation. Enter the password to view.<\u002Fp>\n    <\u002Fdiv>\n    <form id=\"gateForm\">\n      <div class=\"gate-field\"><label>Password<\u002Flabel><input type=\"password\" id=\"gPass\" required=\"\" autofocus=\"\"><\u002Fdiv>\n      <p id=\"gateErr\" class=\"gate-err\">Incorrect password. Please try again.<\u002Fp>\n      <button type=\"submit\" id=\"gateBtn\">View briefing →<\u002Fbutton>\n    <\u002Fform>\n    <p class=\"gate-note\">This document is confidential. For authorized recipients only.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<nav class=\"topnav\">\n  <div class=\"nav-brand\">\n    <svg width=\"22\" height=\"22\" viewBox=\"0 0 35 35\" fill=\"none\">\n      <defs>\n        <linearGradient id=\"ng\" x1=\"8\" y1=\"7\" x2=\"27\" y2=\"29\" gradientUnits=\"userSpaceOnUse\">\n          <stop offset=\"0%\" stop-color=\"#07358E\"><\u002Fstop>\n          <stop offset=\"60%\" stop-color=\"#052a73\"><\u002Fstop>\n          <stop offset=\"100%\" stop-color=\"#5CB24A\"><\u002Fstop>\n        <\u002FlinearGradient>\n      <\u002Fdefs>\n      <path d=\"M26.2494 18.7481C26.2745 21.5014 25.4532 23.7153 23.8543 25.3898C22.2618 27.0643 20.1739 27.8859 17.5781 27.8859C14.9823 27.8859 12.7941 27.0643 11.1702 25.3898C9.55255 23.7153 8.75 21.5014 8.75 18.723V7.91699H12.9697V18.6478C12.9697 20.2721 13.3835 21.5578 14.2299 22.5048C15.0764 23.4581 16.1862 23.9222 17.5718 23.9222C18.8822 23.9222 19.9356 23.4581 20.7382 22.5048C21.5344 21.5515 21.9483 20.2659 21.9483 18.6478V7.91699H26.193L26.2432 18.7481H26.2494Z\" fill=\"url(#ng)\"><\u002Fpath>\n    <\u002Fsvg>\n    <span class=\"nav-wordmark\">Unframe<\u002Fspan>\n    <span class=\"nav-sep\">×<\u002Fspan>\n    <img class=\"client-logo\" src=\"4e7ed1fc-914f-4ab3-914c-55ffdbfccbfe\" alt=\"\" width=\"22\" height=\"22\">\n    <span class=\"nav-label\">Providence · AI Delivery<\u002Fspan>\n  <\u002Fdiv>\n  <div id=\"navDots\"><\u002Fdiv>\n<\u002Fnav>\n\n\n\n<!-- ============================================================\n     SECTION CXO — Providence's CXO priorities (validated)\n     ============================================================ -->\n<section id=\"scxo\" data-screen-label=\"01 CXO priorities\">\n  <style>\n    .cxo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 26px 0 18px; }\n    .cxo-card { background: var(--ink-1); color: #fff; border-radius: 16px; padding: 24px 24px 26px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }\n    .cxo-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--c); }\n    .cxo-card.c1 { --c: var(--bucket-r); }\n    .cxo-card.c2 { --c: var(--bucket-a); }\n    .cxo-card.c3 { --c: var(--bucket-e); }\n    .cxo-tag { font: 700 10px/1.2 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--c); }\n    .cxo-title { font: 800 20px/1.18 var(--font); letter-spacing: -.02em; color: #fff; }\n    .cxo-body { font: 400 13px/1.6 var(--font); color: rgba(255,255,255,.82); }\n    .cxo-body strong { color: #fff; font-weight: 700; }\n    .cxo-validate { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: var(--green-bg); border: 1px solid #bfe3d2; border-radius: 14px; padding: 16px 22px; }\n    .cxo-val-tag { font: 800 12px/1.3 var(--font); color: var(--green); display: flex; align-items: center; gap: 7px; white-space: nowrap; border-right: 1px solid #bfe3d2; padding-right: 18px; }\n    .cxo-val-text { font: 500 13.5px/1.55 var(--font); color: var(--text2); }\n    .cxo-val-text strong { color: var(--text1); }\n    .cxo-cascade { margin-top: 18px; font: 700 12px/1 var(--font); letter-spacing: .04em; color: var(--text3); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }\n    @media (max-width: 960px) { .cxo-grid { grid-template-columns: 1fr; } .cxo-validate { grid-template-columns: 1fr; } .cxo-val-tag { border-right: none; padding-right: 0; } }\n  <\u002Fstyle>\n  <div class=\"shell\">\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">Providence's <em>CXO priorities<\u002Fem>.<\u002Fh2>\n      <p class=\"section-sub\">The Wexler-era frame that flows down to every function. We didn't invent it — it surfaced on the IS side and was validated directly with Bert Martin.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"cxo-grid reveal\" data-delay=\"2\">\n      <article class=\"cxo-card c1\">\n        <span class=\"cxo-tag\">01 · Financial transformation<\u002Fspan>\n        <span class=\"cxo-title\">$2B transformation by 2030.<\u002Fspan>\n        <p class=\"cxo-body\">Wexler's goal, laid out personally. Operating loss narrowed from <strong>$363M to $132M<\u002Fstrong> in 2025. Seven divisions consolidating to three. Operational break-even targeted for 2026.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"cxo-card c2\">\n        <span class=\"cxo-tag\">02 · AI + workforce leverage<\u002Fspan>\n        <span class=\"cxo-title\">AI is central to the 2030 strategy.<\u002Fspan>\n        <p class=\"cxo-body\">AI and digital tools are central to the <strong>2030 strategy<\u002Fstrong>, operationalized under the Office of Transformation. The <strong>$600M<\u002Fstrong> 2026 workforce investment only pays off if teams absorb growing demand <strong>without proportional headcount growth<\u002Fstrong>.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"cxo-card c3\">\n        <span class=\"cxo-tag\">03 · Portfolio rationalization + growth<\u002Fspan>\n        <span class=\"cxo-title\">Divest and build — without losing the brand.<\u002Fspan>\n        <p class=\"cxo-body\">Divesting non-core (Tegria, home-health/hospice JV, SNFs, possibly the health plan) <strong>while<\u002Fstrong> executing facility builds and strategic programs. The brand has to feel coherent through all of it.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <div class=\"cxo-validate reveal\" data-delay=\"3\">\n      <span class=\"cxo-val-tag\">✓ Validated · IS side<\u002Fspan>\n      <span class=\"cxo-val-text\"><strong>Bert Martin<\u002Fstrong>, on the IS side, validated that the <strong>$2B transformation<\u002Fstrong> is being felt across his team.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cxo-cascade reveal\" data-delay=\"3\">↓&nbsp;&nbsp;How it lands in marketing &amp; digital experience<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SECTION 2 — What's pressing (collapsible + rankable)\n     ============================================================ -->\n<section id=\"s4\" data-screen-label=\"04 AI maturity\">\n  <div class=\"shell\">\n    \n\n    <div class=\"s4-hed-row\">\n      <div class=\"reveal\" data-delay=\"1\">\n        <h2 class=\"section-hed\">Where most enterprises <em>actually are<\u002Fem>.<\u002Fh2>\n        <p class=\"section-sub\">A spectrum, not a binary. Four stages of AI maturity — and a shared language for the rest of the conversation.<\u002Fp>\n      <\u002Fdiv>\n      <aside class=\"s4-trillion-card reveal\" data-delay=\"2\">\n        <div class=\"s4tc-collapsed\">\n          <span class=\"s4tc-tag\">Where the ROI is<\u002Fspan>\n          <span class=\"s4tc-title\">The <em>10X<\u002Fem> unlock.<\u002Fspan>\n          <span class=\"s4tc-hint\">Hover to see where →<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s4tc-expanded\">\n          <span class=\"s4tc-tag\">Where the ROI is<\u002Fspan>\n          <span class=\"s4tc-title\">The <em>10X<\u002Fem> unlock.<\u002Fspan>\n          <p class=\"s4tc-body\">Start where AI performs a specific function not reliant on user adoption — or ties together data and systems that were otherwise impossible to connect.<\u002Fp>\n          <p class=\"s4tc-body s4tc-punchline\">Apply focus where ROI is ~10X the current cost, or operational leverage measured in the millions.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n\n    <div class=\"s4-context reveal\" data-delay=\"2\">\n      Where would you put your team's center of mass right now — and where do you want it to be?\n    <\u002Fdiv>\n\n    <style>\n      .mat-spectrum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; position: relative; margin-bottom: 22px; }\n      .mat-seg { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }\n      .mat-seg.is-here { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }\n      .mat-seg-top { display: flex; align-items: center; gap: 12px; }\n      .mat-num { width: 30px; height: 30px; border-radius: 50%; background: var(--neutral-bg); color: var(--text3); font: 800 14px/1 var(--font); display: flex; align-items: center; justify-content: center; flex: none; }\n      .mat-seg.is-here .mat-num { background: var(--brand); color: #fff; }\n      .mat-name { font: 800 16px/1.15 var(--font); color: var(--text1); letter-spacing: -.015em; }\n      .mat-body { font: 400 13px/1.55 var(--font); color: var(--text2); }\n      .mat-tag { font: 700 9px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }\n      .mat-divider { margin: 0 0 22px; display: flex; align-items: center; gap: 14px; }\n      .mat-divider-line { flex: none; width: 0; border-left: 2px dashed var(--brand); height: 22px; }\n      .mat-divider-cap { font: 600 12.5px/1.4 var(--font); color: var(--brand); }\n      .mat-prompt { background: var(--ink-1); color: #fff; border-radius: 14px; padding: 20px 26px; font: 600 clamp(15px,1.3vw,18px)/1.45 var(--font); }\n      .mat-prompt strong { color: var(--accent-bright); }\n      @media (max-width: 960px) { .mat-spectrum { grid-template-columns: 1fr 1fr; } }\n    <\u002Fstyle>\n\n    <div class=\"mat-spectrum reveal\" data-delay=\"3\">\n      <div class=\"mat-seg\">\n        <div class=\"mat-seg-top\"><span class=\"mat-num\">1<\u002Fspan><span class=\"mat-name\">Chat &amp; Copilot<\u002Fspan><\u002Fdiv>\n        <span class=\"mat-body\">ChatGPT, Copilot, Claude — ad-hoc, mostly individual productivity. Useful, but isolated.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mat-seg is-here\">\n        <div class=\"mat-seg-top\"><span class=\"mat-num\">2<\u002Fspan><span class=\"mat-name\">Operationalized AI<\u002Fspan><\u002Fdiv>\n        <span class=\"mat-tag\">Where it starts being useful for the enterprise<\u002Fspan>\n        <span class=\"mat-body\">Enterprise context layered in. AI delivers a real productivity step-change for teams.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mat-seg is-here\">\n        <div class=\"mat-seg-top\"><span class=\"mat-num\">3<\u002Fspan><span class=\"mat-name\">Business Agents<\u002Fspan><\u002Fdiv>\n        <span class=\"mat-body\">Discrete processes run autonomously or semi-autonomously, human-in-the-loop. The 2025 \"agents\" promise — most enterprises aren't here yet.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mat-seg\">\n        <div class=\"mat-seg-top\"><span class=\"mat-num\">4<\u002Fspan><span class=\"mat-name\">Autonomous Enterprise<\u002Fspan><\u002Fdiv>\n        <span class=\"mat-body\">The org runs largely autonomously; humans set the guardrails. Aspirational.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mat-divider reveal\" data-delay=\"3\">\n      <span class=\"mat-divider-line\"><\u002Fspan>\n      <span class=\"mat-divider-cap\">The line between individual tools and enterprise value sits between 1 and 2.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"mat-prompt reveal\" data-delay=\"4\">\n      Most teams place their center of mass in <strong>Stage 1, reaching into 2<\u002Fstrong>. The pressures you ranked are exactly where marketing &amp; digital experience crosses cleanly into 2 — and starts touching 3.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"s2\" data-screen-label=\"02 What's pressing\">\n  <style>\n    .pain-list { display: flex; flex-direction: column; gap: 12px; margin: 24px 0 22px; }\n    .pain { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--neutral); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }\n    .pain.is-r { border-left-color: var(--bucket-r); }\n    .pain.is-e { border-left-color: var(--bucket-e); }\n    .pain.is-a { border-left-color: var(--bucket-a); }\n    .pain-head { display: grid; grid-template-columns: auto 1fr auto auto; gap: 16px; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; }\n    .pain-rank { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 15px/1 var(--font); flex: none; background: var(--neutral-bg); color: var(--text4); border: 1px dashed var(--border-strong); }\n    .pain.ranked .pain-rank { border-style: solid; border-color: transparent; color: #fff; }\n    .pain.ranked.is-r .pain-rank { background: var(--bucket-r); }\n    .pain.ranked.is-e .pain-rank { background: var(--bucket-e); }\n    .pain.ranked.is-a .pain-rank { background: var(--bucket-a); }\n    .pain-titlewrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }\n    .pain-tag { font: 700 9px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; }\n    .pain.is-r .pain-tag { color: var(--bucket-r); }\n    .pain.is-e .pain-tag { color: var(--bucket-e); }\n    .pain.is-a .pain-tag { color: var(--bucket-a); }\n    .pain-title { font: 700 15.5px/1.3 var(--font); color: var(--text1); letter-spacing: -.01em; }\n    .pain-ranker { display: flex; gap: 5px; }\n    .pain-rank-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text3); font: 700 12px/1 var(--font); cursor: pointer; transition: all .15s; }\n    .pain-rank-btn:hover { border-color: var(--brand); color: var(--brand); }\n    .pain-rank-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }\n    .pain-chev { width: 20px; height: 20px; color: var(--text4); transition: transform .25s; flex: none; }\n    .pain.open .pain-chev { transform: rotate(180deg); }\n    .pain-body { max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .25s ease; padding: 0 20px; }\n    .pain.open .pain-body { max-height: 420px; opacity: 1; padding: 0 20px 20px 20px; }\n    .pain-body p { font: 400 13.5px/1.6 var(--font); color: var(--text2); }\n    .pain-why { margin-top: 12px; padding: 12px 16px; background: var(--surface-subtle); border-radius: 10px; }\n    .pain-why-tag { font: 700 9px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--brand); display: block; margin-bottom: 6px; }\n    .pain-why-text { font: 500 12.5px/1.5 var(--font); color: var(--text2); }\n    .pain-why-text strong, .pain-body p strong { color: var(--text1); }\n    .pain-quote { margin-top: 12px; font: 500 13.5px/1.55 var(--font); font-style: italic; color: var(--text2); border-left: 2px solid var(--border-strong); padding: 2px 0 2px 16px; }\n    .pain-quote cite { display: block; font-style: normal; font-weight: 700; font-size: 11px; color: var(--text3); margin-top: 8px; }\n    .pain-ranker-hint { font: 600 10px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--text4); margin-right: 2px; align-self: center; }\n    @media (max-width: 760px) { .pain-head { grid-template-columns: auto 1fr auto; } .pain-ranker { grid-column: 1 / -1; justify-content: flex-end; } }\n  <\u002Fstyle>\n  <div class=\"shell\">\n\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">Working backwards: are we helping more people choose Providence and access the right care?<\u002Fh2>\n      <p class=\"section-sub\">Every use case below ladders up to that question. Surfaced from your public read and the priorities flowing down from Wexler — open each one, tell us where we're warm or cold, and rank the ones that ring true.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"pain-list reveal\" data-delay=\"2\" id=\"painList\">\n\n      <article class=\"pain is-a\" data-pain=\"p1\">\n        <div class=\"pain-head\">\n          <span class=\"pain-rank\">—<\u002Fspan>\n          <span class=\"pain-titlewrap\"><span class=\"pain-tag\">Automation &amp; Agents<\u002Fspan><span class=\"pain-title\">A digital front door split across tools — where every break lands in the call center<\u002Fspan><\u002Fspan>\n          <span class=\"pain-ranker\"><span class=\"pain-ranker-hint\">Rank<\u002Fspan><button class=\"pain-rank-btn\" data-r=\"1\">1<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"2\">2<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"3\">3<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"4\">4<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"5\">5<\u002Fbutton><\u002Fspan>\n          <svg class=\"pain-chev\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"pain-body\">\n          <p>A patient who needs to find a provider, confirm they're in-network, check availability, and book often has to cross find-a-doc, scheduling, payer eligibility, and service-line content — each its own tool, each its own logic. When a step breaks, the journey rarely ends; it tends to fall back to the call center, and some of it leaks to retail and virtual competitors.<\u002Fp>\n          <div class=\"pain-why\"><span class=\"pain-why-tag\">The opportunity<\u002Fspan><span class=\"pain-why-text\">When brand, digital, and service channels sit under one leader, a broken journey is visible from both ends. The highest-value AI here is rarely a better website — it's a governed workflow layer that orchestrates <strong>find → choose → reach care<\u002Fstrong> across all of them.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"pain is-a\" data-pain=\"p2\">\n        <div class=\"pain-head\">\n          <span class=\"pain-rank\">—<\u002Fspan>\n          <span class=\"pain-titlewrap\"><span class=\"pain-tag\">Automation &amp; Agents<\u002Fspan><span class=\"pain-title\">Call centers absorbing the failure of upstream journeys<\u002Fspan><\u002Fspan>\n          <span class=\"pain-ranker\"><span class=\"pain-ranker-hint\">Rank<\u002Fspan><button class=\"pain-rank-btn\" data-r=\"1\">1<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"2\">2<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"3\">3<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"4\">4<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"5\">5<\u002Fbutton><\u002Fspan>\n          <svg class=\"pain-chev\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"pain-body\">\n          <p>Service channels are often where broken digital journeys land: “where do I go?”, scheduling, eligibility, referral status, appointment prep, billing. It surfaces as high volume, long handle times, inconsistent knowledge access, manual after-call work, and agent churn. The answer is rarely <em>more<\u002Fem> agents — it's orchestration, approved-knowledge retrieval, and agent-assist that resolves complex journeys faster.<\u002Fp>\n          <div class=\"pain-why\"><span class=\"pain-why-tag\">The opportunity<\u002Fspan><span class=\"pain-why-text\">This is often the clearest economic line in a service organization — <strong>handle time, first-contact resolution, and digital containment<\u002Fstrong> are measurable in weeks. And it's low-risk to test: humans stay in the loop, governance intact.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"pain is-e\" data-pain=\"p3\">\n        <div class=\"pain-head\">\n          <span class=\"pain-rank\">—<\u002Fspan>\n          <span class=\"pain-titlewrap\"><span class=\"pain-tag\">Extraction &amp; Abstraction<\u002Fspan><span class=\"pain-title\">Consumer signal — calls, chats, searches — going unread<\u002Fspan><\u002Fspan>\n          <span class=\"pain-ranker\"><span class=\"pain-ranker-hint\">Rank<\u002Fspan><button class=\"pain-rank-btn\" data-r=\"1\">1<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"2\">2<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"3\">3<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"4\">4<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"5\">5<\u002Fbutton><\u002Fspan>\n          <svg class=\"pain-chev\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"pain-body\">\n          <p>Call transcripts, chat logs, search terms, form abandons, app feedback, survey comments, reviews — a large health system generates an enormous stream of unstructured consumer signal. Rarely is it clustered into the top reasons patients call, where journeys break by region and service line, or which sentiment is turning. Built into a map, it's often the fastest route to knowing what to fix first — for both CX and marketing.<\u002Fp>\n          <div class=\"pain-why\"><span class=\"pain-why-tag\">The opportunity<\u002Fspan><span class=\"pain-why-text\">It's the <strong>same data the call center already produces<\u002Fstrong>. Turned into an executive friction map, it points to which workflow to fix first — and proves it moved the number.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"pain is-r\" data-pain=\"p4\">\n        <div class=\"pain-head\">\n          <span class=\"pain-rank\">—<\u002Fspan>\n          <span class=\"pain-titlewrap\"><span class=\"pain-tag\">Reporting &amp; Observability<\u002Fspan><span class=\"pain-title\">Marketing and digital spend that can't be tied to booked care<\u002Fspan><\u002Fspan>\n          <span class=\"pain-ranker\"><span class=\"pain-ranker-hint\">Rank<\u002Fspan><button class=\"pain-rank-btn\" data-r=\"1\">1<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"2\">2<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"3\">3<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"4\">4<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"5\">5<\u002Fbutton><\u002Fspan>\n          <svg class=\"pain-chev\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"pain-body\">\n          <p>Consumer signal is typically scattered across web, app, CRM, scheduling, and the call center, with no unified view. Marketing is increasingly expected to prove growth, not activity — and when the line from a campaign or page view to a <strong>scheduled appointment<\u002Fstrong> is broken, intent leaks invisibly on the way to booked care, with no read on which service lines and markets are really converting.<\u002Fp>\n          <div class=\"pain-why\"><span class=\"pain-why-tag\">The opportunity<\u002Fspan><span class=\"pain-why-text\">Under margin pressure, every marketing dollar is asked to tell an <strong>attributable-growth story<\u002Fstrong>. Since that instrumentation has to be built regardless, building it AI-native lets it surface friction, not just report spend.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"pain is-e\" data-pain=\"p5\">\n        <div class=\"pain-head\">\n          <span class=\"pain-rank\">—<\u002Fspan>\n          <span class=\"pain-titlewrap\"><span class=\"pain-tag\">Extraction &amp; Abstraction<\u002Fspan><span class=\"pain-title\">Content and knowledge for 50+ hospitals, produced and governed at scale<\u002Fspan><\u002Fspan>\n          <span class=\"pain-ranker\"><span class=\"pain-ranker-hint\">Rank<\u002Fspan><button class=\"pain-rank-btn\" data-r=\"1\">1<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"2\">2<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"3\">3<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"4\">4<\u002Fbutton><button class=\"pain-rank-btn\" data-r=\"5\">5<\u002Fbutton><\u002Fspan>\n          <svg class=\"pain-chev\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"pain-body\">\n          <p>Bios, service-line pages, and FAQs across 50+ hospitals each need to be locally personalized, on-brand, and machine-readable — while the patient-experience signal (reviews, NPS, social) that should inform them often sits unstructured. At the same time, anything consumer- or agent-facing has to answer only from <strong>approved, clinically-safe knowledge<\u002Fstrong>.<\u002Fp>\n          <div class=\"pain-why\"><span class=\"pain-why-tag\">The opportunity<\u002Fspan><span class=\"pain-why-text\">One governed knowledge layer can be the reusable foundation under all of it — website AI search, agent assist, patient navigation — making it possible to move fast <strong>without<\u002Fstrong> putting brand trust or compliance at risk.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n\n    <div class=\"s2-method reveal\" data-delay=\"3\">\n      <span class=\"s2m-tag\">Where we'd start<\u002Fspan>\n      <span class=\"s2m-text\">\n        <strong>Rank the ones that ring true.<\u002Fstrong> Wherever you point us, that's where we'd start: a production-ready solution in your hands in <strong>days, not months<\u002Fstrong>,\n        no commitment until it works against your data, in your environment.\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ============================================================\n     SECTION FAIL — Why most enterprise AI projects fail\n     ============================================================ -->\n<section id=\"sfail\" data-screen-label=\"Why AI fails\">\n  <style>\n    .fail-lead { display: flex; gap: 18px; align-items: baseline; margin: 6px 0 26px; flex-wrap: wrap; }\n    .fail-stat { font: 800 clamp(40px,5vw,68px)/1 var(--font); letter-spacing: -.03em; color: var(--brand); }\n    .fail-lead-text { font: 500 clamp(15px,1.3vw,18px)/1.45 var(--font); color: var(--text2); max-width: 620px; }\n    .fail-lead-text strong { color: var(--text1); }\n    .fail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }\n    .fail-col { border-radius: 14px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }\n    .fail-col.win { background: var(--ink-1); border-color: transparent; box-shadow: var(--shadow-lg); }\n    .fail-col-head { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }\n    .fail-col.win .fail-col-head { border-bottom-color: rgba(255,255,255,.16); }\n    .fail-kicker { font: 800 11px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--text4); }\n    .fail-col.win .fail-kicker { color: var(--accent-bright); }\n    .fail-sub { font: 700 15px/1.2 var(--font); letter-spacing: -.01em; color: var(--text1); }\n    .fail-col.win .fail-sub { color: #fff; }\n    .fail-list { list-style: none; display: flex; flex-direction: column; gap: 10px; padding: 0; }\n    .fail-list li { font: 400 12.5px/1.5 var(--font); color: var(--text2); padding-left: 22px; position: relative; }\n    .fail-list li::before { content: '✕'; position: absolute; left: 0; top: 0; font-size: 12px; color: var(--brand); font-weight: 700; }\n    .fail-col.win .fail-list li { color: rgba(255,255,255,.9); }\n    .fail-col.win .fail-list li::before { content: '✓'; color: var(--accent-bright); }\n    @media (max-width: 960px) { .fail-grid { grid-template-columns: 1fr 1fr; } }\n  <\u002Fstyle>\n  <div class=\"shell\">\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">Why most enterprise AI projects <em>fail<\u002Fem>.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"fail-lead reveal\" data-delay=\"1\">\n      <span class=\"fail-stat\">95%<\u002Fspan>\n      <span class=\"fail-lead-text\">don't deliver business value <strong>(MIT, 2025)<\u002Fstrong>. It's not because AI doesn't work — it's because the delivery models don't.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"fail-grid reveal\" data-delay=\"2\">\n      <article class=\"fail-col\">\n        <div class=\"fail-col-head\"><span class=\"fail-kicker\">Buy<\u002Fspan><span class=\"fail-sub\">Point Solutions<\u002Fspan><\u002Fdiv>\n        <ul class=\"fail-list\">\n          <li>Generic, doesn't fit your business<\u002Fli>\n          <li>100 silos = governance nightmare<\u002Fli>\n          <li>No shared data or context, and they don't compound<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article class=\"fail-col\">\n        <div class=\"fail-col-head\"><span class=\"fail-kicker\">Build<\u002Fspan><span class=\"fail-sub\">DIY / Claude Code<\u002Fspan><\u002Fdiv>\n        <ul class=\"fail-list\">\n          <li>Coding is only 10%; solutioning is the other 90%<\u002Fli>\n          <li>AI changes daily — your team owns the maintenance<\u002Fli>\n          <li>Architecture, grounding, auditability, determinism — all you<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article class=\"fail-col\">\n        <div class=\"fail-col-head\"><span class=\"fail-kicker\">Hire<\u002Fspan><span class=\"fail-sub\">Consultancies / FDE<\u002Fspan><\u002Fdiv>\n        <ul class=\"fail-list\">\n          <li>Strategy decks &amp; FDEs, not working solutions<\u002Fli>\n          <li>Slow time-to-value, billed by the human hour<\u002Fli>\n          <li>Misaligned goals: billable hours vs. delivered outcomes<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article class=\"fail-col win\">\n        <div class=\"fail-col-head\"><span class=\"fail-kicker\">Unframe<\u002Fspan><span class=\"fail-sub\">Managed AI Delivery<\u002Fspan><\u002Fdiv>\n        <ul class=\"fail-list\">\n          <li>Tailored to your business<\u002Fli>\n          <li>Measurable impact in weeks<\u002Fli>\n          <li>Managed long-term, compounding benefit<\u002Fli>\n          <li>Aligned outcomes<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SECTION APPROACH — The Unframe Approach\n     ============================================================ -->\n<section id=\"sapproach\" data-screen-label=\"The approach\">\n  <style>\n    .appr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 26px 0 20px; position: relative; }\n    .appr-step { padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 14px; position: relative; }\n    .appr-step:not(:last-child)::after { content: '→'; position: absolute; right: -13px; top: 38px; font: 700 22px/1 var(--font); color: var(--brand); z-index: 2; }\n    .appr-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); height: 100%; padding: 26px; display: flex; flex-direction: column; gap: 12px; }\n    .appr-num { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; font: 800 16px/1 var(--font); display: flex; align-items: center; justify-content: center; }\n    .appr-name { font: 800 20px/1.1 var(--font); letter-spacing: .02em; color: var(--text1); text-transform: uppercase; }\n    .appr-body { font: 400 14px/1.6 var(--font); color: var(--text2); }\n    .appr-strip { background: var(--brand); color: #fff; border-radius: 14px; padding: 18px 26px; font: 600 clamp(15px,1.3vw,18px)/1.4 var(--font); display: flex; align-items: center; gap: 12px; }\n    @media (max-width: 860px) { .appr-grid { grid-template-columns: 1fr; } .appr-step:not(:last-child)::after { content: '↓'; right: auto; left: 42px; top: auto; bottom: -10px; } }\n  <\u002Fstyle>\n  <div class=\"shell\">\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">The <em>Unframe approach<\u002Fem>.<\u002Fh2>\n      <p class=\"section-sub\">Three steps. Fast. You pay only when it works.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"appr-grid reveal\" data-delay=\"2\">\n      <div class=\"appr-step\">\n        <div class=\"appr-card\">\n          <span class=\"appr-num\">1<\u002Fspan>\n          <span class=\"appr-name\">Land<\u002Fspan>\n          <p class=\"appr-body\">We land on the right use case together — the one with real business value.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"appr-step\">\n        <div class=\"appr-card\">\n          <span class=\"appr-num\">2<\u002Fspan>\n          <span class=\"appr-name\">Deliver<\u002Fspan>\n          <p class=\"appr-body\">We deliver a production-grade solution on our platform — fast. Measurable impact in weeks.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"appr-step\">\n        <div class=\"appr-card\">\n          <span class=\"appr-num\">3<\u002Fspan>\n          <span class=\"appr-name\">Subscribe<\u002Fspan>\n          <p class=\"appr-body\">You pay only when you're happy. Per solution, per year.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"appr-strip reveal\" data-delay=\"3\">\n      <span>Subscribe only when happy. <strong>No upfront cost or commitment.<\u002Fstrong><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SECTION STACK — Unframe AI Solution Stack\n     ============================================================ -->\n<section id=\"sstack\" data-screen-label=\"Solution stack\">\n  <style>\n    .stk-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; align-items: center; margin-top: 24px; }\n    .stk-diagram { display: flex; flex-direction: column; align-items: center; gap: 0; }\n    .stk-blueprint { display: inline-flex; align-items: center; gap: 9px; background: var(--neutral-bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px 20px; font: 800 16px/1 var(--font); color: var(--text1); letter-spacing: -.01em; box-shadow: var(--shadow); position: relative; z-index: 2; }\n    .stk-blueprint svg { width: 22px; height: 22px; }\n    .stk-connector { width: 2px; height: 18px; background: var(--border-strong); }\n    .stk-platform { width: 100%; border-radius: 18px; padding: 22px; color: #fff; background: linear-gradient(125deg, #E0179D 0%, #9C1AD4 30%, #3F4FE0 62%, #FF8A1F 100%); box-shadow: var(--shadow-lg); }\n    .stk-platform-t { font: 800 22px/1.1 var(--font); text-align: center; letter-spacing: -.02em; }\n    .stk-platform-s { font: 600 11px/1.3 var(--font); text-align: center; opacity: .92; margin: 4px 0 16px; }\n    .stk-bricks { display: flex; flex-direction: column; gap: 8px; }\n    .stk-brick-row { display: flex; gap: 8px; }\n    .stk-brick { height: 30px; border-radius: 7px; background: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.06); flex: 1; }\n    .stk-foot { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }\n    .stk-foot-item { display: flex; align-items: center; gap: 7px; font: 700 12px/1.2 var(--font); color: var(--text2); }\n    .stk-foot-item svg { width: 17px; height: 17px; color: var(--ink-1); }\n    .stk-rows { display: flex; flex-direction: column; gap: 18px; }\n    .stk-row { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; }\n    .stk-row image-slot, .stk-row .stk-img { width: 150px; height: 112px; }\n    .stk-row .stk-img { object-fit: contain; border-radius: 14px; border: 1px solid var(--border); background: #fff; }\n    .stk-row p { font: 400 14px/1.6 var(--font); color: var(--text2); }\n    .stk-row p strong { color: var(--text1); font-weight: 700; }\n    @media (max-width: 900px) { .stk-wrap { grid-template-columns: 1fr; } }\n  <\u002Fstyle>\n  <div class=\"shell\">\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">The Unframe <em>solution stack<\u002Fem>.<\u002Fh2>\n      <p class=\"section-sub\">Behind the scenes — deep technical building blocks, assembled by a blueprint into a turnkey solution tailored to your use case.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"stk-wrap reveal\" data-delay=\"2\">\n      <div class=\"stk-diagram\">\n        <span class=\"stk-blueprint\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l8 4.5-8 4.5-8-4.5L12 3z\" fill=\"#3F4FE0\"><\u002Fpath><path d=\"M4 7.5v9L12 21l8-4.5v-9\" stroke=\"#7800FF\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 12v9\" stroke=\"#7800FF\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n          Blueprint\n        <\u002Fspan>\n        <span class=\"stk-connector\"><\u002Fspan>\n        <div class=\"stk-platform\">\n          <div class=\"stk-platform-t\">Unframe Platform<\u002Fdiv>\n          <div class=\"stk-platform-s\">Comprised of deep technical building blocks<\u002Fdiv>\n          <div class=\"stk-bricks\">\n            <div class=\"stk-brick-row\"><span class=\"stk-brick\" style=\"flex:3\"><\u002Fspan><\u002Fdiv>\n            <div class=\"stk-brick-row\"><span class=\"stk-brick\"><\u002Fspan><span class=\"stk-brick\"><\u002Fspan><span class=\"stk-brick\"><\u002Fspan><\u002Fdiv>\n            <div class=\"stk-brick-row\"><span class=\"stk-brick\" style=\"flex:2\"><\u002Fspan><span class=\"stk-brick\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stk-foot\">\n            <span class=\"stk-foot-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z\" stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>No data leaves your perimeter<\u002Fspan>\n            <span class=\"stk-foot-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"3\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Fcircle><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 und: var(--surface); border: 2px solid var(--border-strong); border-radius: 12px; padding: 16px 14px; text-align: center; font: 700 14px/1.2 var(--font); color: var(--text1); box-shadow: var(--shadow); }\n    .kf-node.cyan { border-color: #0bb3d6; }\n    .kf-node.purple { border-color: #7800FF; }\n    .kf-bucket { position: relative; background: var(--surface); border: 2px solid #DF00B4; border-radius: 12px; padding: 14px; text-align: center; font: 700 14px/1.2 var(--font); color: var(--text1); box-shadow: var(--shadow); cursor: help; transition: transform .15s, box-shadow .15s; }\n    .kf-bucket:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: #b8008f; }\n    .kf-tip { position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--ink-1); color: #fff; font: 500 11.5px/1.35 var(--font); padding: 8px 11px; border-radius: 8px; width: 168px; opacity: 0; visibility: hidden; transition: opacity .18s, transform .18s; z-index: 20; box-shadow: var(--shadow-lg); }\n    .kf-tip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--ink-1); }\n    .kf-bucket:hover .kf-tip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }\n    .kf-stack { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }\n    .kf-srow { border-radius: 12px; padding: 15px 16px; font: 800 15px/1.1 var(--font); display: flex; align-items: center; gap: 10px; }\n    .kf-srow.sol { background: var(--neutral-bg); color: var(--text1); justify-content: space-between; }\n    .kf-srow.sol .kf-diamonds { display: flex; gap: 3px; }\n    .kf-srow.sol .kf-diamonds i { width: 16px; height: 16px; background: linear-gradient(135deg,#3F4FE0,#7800FF); transform: rotate(45deg); border-radius: 3px; display: block; }\n    .kf-srow.plat { background: linear-gradient(125deg,#E0179D,#9C1AD4 45%,#3F4FE0 75%,#FF8A1F); color: #fff; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; }\n    .kf-srow.plat b { font: 800 14px/1.15 var(--font); white-space: nowrap; }\n    .kf-srow.plat small { font: 600 9.5px/1.2 var(--font); opacity: .92; white-space: nowrap; }\n    .kf-srow.fab { background: linear-gradient(120deg,#7800FF,#9C1AD4); color: #fff; justify-content: center; font-size: 17px; padding: 20px 16px; }\n    .kf-foot { background: var(--surface-subtle); border-radius: 12px; padding: 16px 22px; font: 500 13.5px/1.6 var(--font); color: var(--text2); }\n    .kf-foot strong { color: var(--text1); }\n    @media (max-width: 900px) { .kf-flow { grid-template-columns: 1fr 1fr; } .kf-lines { display: none; } }\n  <\u002Fstyle>\n  <div class=\"shell\">\n    <div class=\"reveal\" data-delay=\"1\">\n      <div class=\"kf-eyebrow\">Compounding benefit<\u002Fdiv>\n      <h2 class=\"section-hed\">The <em>Knowledge Fabric<\u002Fem>.<\u002Fh2>\n      <p class=\"section-sub\">An AI-native representation of your business — the shared layer that makes every solution smarter from day one.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"kf-flow reveal\" data-delay=\"2\" id=\"kfFlow\">\n      <svg class=\"kf-lines\" id=\"kfLines\" preserveAspectRatio=\"none\"><\u002Fsvg>\n      <div class=\"kf-col\" data-kf-col=\"a\">\n        <div class=\"kf-node cyan\" data-kf=\"a0\">Integrations<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kf-col\" data-kf-col=\"b\">\n        <div class=\"kf-node purple\" data-kf=\"b0\">AI Modules<\u002Fdiv>\n        <div class=\"kf-node purple\" data-kf=\"b1\">Conversational Agents<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kf-col\" data-kf-col=\"c\">\n        <div class=\"kf-bucket\" data-kf=\"c0\">Meaning<span class=\"kf-tip\">What your data actually refers to<\u002Fspan><\u002Fdiv>\n        <div class=\"kf-bucket\" data-kf=\"c1\">Relations<span class=\"kf-tip\">How entities connect to one another<\u002Fspan><\u002Fdiv>\n        <div class=\"kf-bucket\" data-kf=\"c2\">Cues<span class=\"kf-tip\">Signals that guide the right response<\u002Fspan><\u002Fdiv>\n        <div class=\"kf-bucket\" data-kf=\"c3\">Examples<span class=\"kf-tip\">Real samples it learns patterns from<\u002Fspan><\u002Fdiv>\n        <div class=\"kf-bucket\" data-kf=\"c4\">Feedback<span class=\"kf-tip\">Corrections that make it smarter over time<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kf-stack\" data-kf-col=\"d\">\n        <div class=\"kf-srow sol\"><span>Solutions<\u002Fspan><span class=\"kf-diamonds\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan><\u002Fdiv>\n        <div class=\"kf-srow plat\"><b>Unframe Platform<\u002Fb><small>incl. building blocks<\u002Fsmall><\u002Fdiv>\n        <div class=\"kf-srow fab\" data-kf=\"d0\">Knowledge Fabric<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"kf-foot reveal\" data-delay=\"3\">\n      All your solutions run on a shared layer called <strong>the Knowledge Fabric<\u002Fstrong> — an AI-native representation of your business that's continuously learning from the variety of data sources, the solutions you have, and the user interactions within them. This makes all your solutions far smarter and far more relevant from day one.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"s6\" data-screen-label=\"06 The platform\">\n  <div class=\"shell\">\n    \n\n    <div class=\"reveal\" data-delay=\"1\">\n      <h2 class=\"section-hed\">The <em>Framery<\u002Fem> — the open platform underneath.<\u002Fh2>\n      <p class=\"section-sub\">Each solution is one workload. The Framery is the AI OS that powers them — designed to plug into your AI program, not replace it, with enterprise-grade guardrails out of the box.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"framery-wrap reveal\" data-delay=\"2\">\n\n      <!-- Row 1: People ↔ Managed Solutions -->\n      <div class=\"fw-side-card is-left fw-row-1\">\n        <span class=\"
